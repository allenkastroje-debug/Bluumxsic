  --orbe-a:rgb(29 185 84 / .55); --orbe-b:rgb(20 184 166 / .55); --orbe-c:rgb(88 101 242 / .55);
  --radio:16px; --blur:none; --margen:16px; --escala:1;
  --fuente:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --seg:env(safe-area-inset-bottom,0px); --top:env(safe-area-inset-top,0px);
  --ancho:680px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0; background:var(--bg); color:var(--text); font-family:var(--fuente); line-height:1.35;
  min-height:100dvh; overscroll-behavior-y:none; transition:background-color .35s, color .35s;
}
button, input, textarea, select { font:inherit; color:inherit; }
button { cursor:pointer; }
h1,h2,h3,p { margin:0; }
small { color:var(--muted); }
[hidden] { display:none !important; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

/* ───── Fondo del modo cristal ───── */
#fondo { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; display:none; }
html[data-cristal="1"] #fondo { display:block; }
.orbe { position:absolute; border-radius:50%; width:90vmax; height:90vmax; will-change:transform; }
.o1 { background:radial-gradient(circle,var(--orbe-a),transparent 66%); left:-35vmax; top:-30vmax; }
.o2 { background:radial-gradient(circle,var(--orbe-b),transparent 66%); right:-45vmax; bottom:-35vmax; }
.o3 { background:radial-gradient(circle,var(--orbe-c),transparent 66%); right:-10vmax; top:15vh; width:65vmax; height:65vmax; }
html[data-orbes="1"] .o1 { animation:flota1 17s ease-in-out infinite alternate; }
html[data-orbes="1"] .o2 { animation:flota2 22s ease-in-out infinite alternate; }
html[data-orbes="1"] .o3 { animation:flota3 14s ease-in-out infinite alternate; }
@keyframes flota1 { to { transform:translate(30vmax,22vmax) scale(1.1); } }
@keyframes flota2 { to { transform:translate(-32vmax,-26vmax) scale(.92); } }
@keyframes flota3 { to { transform:translate(-26vmax,24vmax) scale(1.15); } }

#app { position:relative; z-index:1; max-width:var(--ancho); margin:0 auto; min-height:100dvh; }

/* ───── Cabecera y pestañas ───── */
#cabecera {
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(var(--top) + 10px) var(--margen) 10px; background:var(--bg);
  border-bottom:1px solid transparent;
}
html[data-cristal="1"] #cabecera { background:var(--side); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-bottom-color:var(--line); }
.marca { display:flex; align-items:center; gap:10px; min-width:0; }
.logo { width:38px; height:38px; flex:none; background:var(--logo);
  -webkit-mask:var(--logo-img) center/contain no-repeat; mask:var(--logo-img) center/contain no-repeat; transition:background-color .3s; }
.marca-txt { display:flex; flex-direction:column; min-width:0; }
.marca-txt b { font-size:1.2rem; line-height:1.1; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.marca-txt small { font-weight:600; font-size:.78rem; }
.tasa { display:flex; flex-direction:column; align-items:flex-end; padding:6px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); transition:transform .15s; }
.tasa small { font-size:.66rem; line-height:1; }
.tasa b { font-size:.95rem; }
.tasa.falta b { color:var(--warn); }
.tasa:active { transform:scale(.95); }

#tabs {
  position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:var(--ancho); z-index:20;
  display:grid; grid-template-columns:repeat(5,1fr); padding:6px 6px calc(var(--seg) + 6px);
  background:var(--side); border-top:1px solid var(--line); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
}
.tab { display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border:0; background:transparent; color:var(--muted);
  font-size:.68rem; font-weight:600; border-radius:14px; transition:color .2s, background .2s; }
.tab-ic { position:relative; font-size:1.3rem; line-height:1.2; transition:transform .25s cubic-bezier(.3,1.6,.5,1); }
.tab.act { color:var(--accent); background:var(--accent-faint); }
.tab.act .tab-ic { transform:translateY(-2px) scale(1.15); }
.punto-n { position:absolute; top:-4px; right:-10px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--danger); color:#fff;
  font:700 .62rem/16px var(--fuente); font-style:normal; text-align:center; }

#vista { padding:6px var(--margen) calc(var(--seg) + 110px); outline:none; }
#vista.entra { animation:entra .38s cubic-bezier(.2,.8,.3,1); }
@keyframes entra { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:none; } }
.pagina { display:flex; flex-direction:column; gap:12px; }
.tit { font-size:1.6rem; }
.sub { color:var(--muted); margin-top:-6px; }
.sec-t { font-size:1.05rem; margin-top:6px; }
.pie { text-align:center; color:var(--muted); font-size:.75rem; margin-top:10px; }

/* ───── Tarjetas ───── */
.card {
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radio); padding:14px;
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); transition:transform .2s, box-shadow .25s, background .3s, border-color .3s;
}
html[data-cristal="1"] .card { box-shadow:inset 0 1px 0 rgb(255 255 255 / .22), 0 10px 30px rgb(0 0 0 / .16); }
[class*="st-"] { --st:var(--ok); }
.st-Debe { --st:var(--danger); } .st-Hoy { --st:var(--hoy); } .st-Cerca { --st:var(--warn); } .st-Pagado { --st:var(--ok); }
.card[class*="st-"] { border-left:4px solid var(--st); background-image:linear-gradient(90deg,color-mix(in srgb,var(--st) 9%,transparent),transparent 65%); }
.card.alerta { border-left:4px solid var(--st); background-image:linear-gradient(90deg,color-mix(in srgb,var(--st) 16%,transparent),transparent 80%); display:flex; flex-direction:column; gap:2px; }
.lista { display:flex; flex-direction:column; gap:10px; }
.lista > * { animation:sube .42s cubic-bezier(.2,.8,.3,1) both; }
.lista > *:nth-child(2) { animation-delay:.04s; } .lista > *:nth-child(3) { animation-delay:.08s; }
.lista > *:nth-child(4) { animation-delay:.12s; } .lista > *:nth-child(n+5) { animation-delay:.16s; }
@keyframes sube { from { opacity:0; transform:translateY(14px) scale(.98); } to { opacity:1; transform:none; } }

.chip { display:inline-flex; align-items:center; padding:3px 10px; border-radius:999px; font-size:.74rem; font-weight:700; white-space:nowrap;
  color:var(--st,var(--accent)); background:color-mix(in srgb,var(--st,var(--accent)) 16%,transparent); }
.fila-chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.fila-chips.envolver { margin:2px 0 4px; }
.chipbtn { padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-weight:600; font-size:.85rem;
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); transition:all .2s; }
.chipbtn i { font-style:normal; opacity:.75; margin-left:3px; }
.chipbtn.act { background:var(--grad); color:var(--on-accent); border-color:transparent; box-shadow:0 4px 14px var(--accent-faint); }
.chipbtn:active { transform:scale(.95); }

/* ───── Botones ───── */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 16px; border-radius:12px; border:1px solid transparent;
  background:var(--grad); color:var(--on-accent); font-weight:700; font-size:.92rem; text-decoration:none; transition:transform .12s, opacity .2s, filter .2s; }
.btn:active { transform:scale(.95); }
.btn:disabled { opacity:.4; pointer-events:none; }
.btn.fantasma { background:var(--surface2); color:var(--text); border-color:var(--line); }
.btn.peligro { background:var(--danger); color:#fff; }
.btn.mini { padding:7px 12px; font-size:.8rem; border-radius:10px; }
.peligro-t { color:var(--danger) !important; }
.icono { width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:50%; border:1px solid var(--line); background:var(--surface2); color:var(--text); transition:transform .12s; }
.icono.chico { width:30px; height:30px; font-size:.8rem; }
.icono:active { transform:scale(.88); }
.acciones { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.acciones.fin { justify-content:flex-end; }
.fab { position:fixed; z-index:15; bottom:calc(var(--seg) + 84px); right:max(var(--margen),calc((100vw - var(--ancho)) / 2 + var(--margen)));
  width:58px; height:58px; border-radius:50%; border:0; background:var(--grad); color:var(--on-accent); font-size:1.9rem; line-height:1;
  box-shadow:0 10px 26px rgb(0 0 0 / .4), 0 0 0 5px var(--accent-faint); animation:pop .5s cubic-bezier(.3,1.6,.5,1) both; transition:transform .15s; }
.fab:active { transform:scale(.9) rotate(90deg); }
@keyframes pop { from { transform:scale(0); } to { transform:scale(1); } }

/* ───── Resumen ───── */
.mes-nav { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.mes-nav h1 { font-size:1.35rem; } .mes-nav.chico h2 { font-size:1.05rem; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat { display:flex; flex-direction:column; gap:2px; }
.stat small { font-weight:600; }
.stat b { font-size:1.3rem; }
.stat span { color:var(--muted); font-size:.82rem; }
.stat.ing b { color:var(--ok); } .stat.gas b { color:var(--danger); } .stat.cob b { color:var(--warn); }
.fila { display:flex; align-items:center; gap:10px; padding:12px; }
.fila-info { flex:1; min-width:0; display:flex; flex-direction:column; }
.fila-info b, .fila-info small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
button.fila { width:100%; text-align:left; color:inherit; }
.vacio { display:flex; flex-direction:column; align-items:center; gap:4px; padding:34px 16px; text-align:center; color:var(--muted); }
.vacio span { font-size:2.4rem; } .vacio b { color:var(--text); }

/* ───── Clientes ───── */
.buscar { display:flex; align-items:center; gap:8px; padding:0 14px; border-radius:14px; background:var(--surface); border:1px solid var(--line);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); }
#vista .buscar input { flex:1; border:0; background:transparent; padding:12px 0; outline:none; box-shadow:none; border-radius:0; font-size:max(16px,1rem); }
.cli { padding:0; overflow:hidden; }
.cli:active { transform:scale(.985); }
.cli-cab { display:flex; width:100%; justify-content:space-between; gap:10px; padding:14px 14px 6px; border:0; background:transparent; text-align:left; }
.cli-info { display:flex; flex-direction:column; min-width:0; }
.cli-info b { font-size:1.05rem; } .cli-info small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cli-der { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:none; }
.cli-der > b { font-size:1.05rem; }
.cli-pie { display:flex; justify-content:space-between; padding:0 14px 12px; font-size:.8rem; color:var(--muted); }
.cli.abierto { transform:scale(1.015); box-shadow:0 14px 34px color-mix(in srgb,var(--st) 25%,transparent); border-color:color-mix(in srgb,var(--st) 55%,var(--line)); border-left-color:var(--st); }
.detalle { display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s cubic-bezier(.3,.8,.3,1); }
.abierto > .detalle { grid-template-rows:1fr; }
.det-in { overflow:hidden; min-height:0; }
.cli .det-in { padding:0 14px; }
.cli.abierto .det-in { padding-bottom:14px; }
.det-in > :first-child { margin-top:4px; }
.datos { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin:0; padding-top:10px; border-top:1px solid var(--line); }
.datos dt { font-size:.72rem; color:var(--muted); } .datos dd { margin:0; font-weight:600; }
.datos .ancho { grid-column:1 / -1; }
.det-in h3 { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 6px; font-weight:700; }
.cuentas { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.cuentas li { display:flex; justify-content:space-between; gap:8px; padding:8px 12px; border-radius:10px; background:var(--surface2); }
.cuentas li.cta { align-items:center; border-left:4px solid var(--st-c, var(--ok)); }
.cuentas li.st-Debe { --st-c:var(--danger); } .cuentas li.st-Hoy { --st-c:var(--hoy); } .cuentas li.st-Cerca { --st-c:var(--warn); } .cuentas li.st-Pagado { --st-c:var(--ok); }
.cta-info { display:flex; flex-direction:column; gap:3px; min-width:0; }
.cta-info small { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; }
.interruptor { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:12px; background:var(--surface2); cursor:pointer; }
.interruptor[hidden] { display:none; }
.interruptor input[type=checkbox] { width:20px; height:20px; margin-top:2px; accent-color:var(--accent); flex:none; }
.interruptor small { color:var(--muted); }
.cli-der b small { font-weight:500; color:var(--muted); font-size:.72rem; }

/* ───── Planes ───── */
.plan { display:flex; flex-direction:column; gap:8px; }
.plan-cab { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.plan-cab b { font-size:1.1rem; } .plan-cab > div { display:flex; flex-direction:column; min-width:0; }
.cupos { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.puntos { display:inline-flex; gap:5px; }
.pt { width:14px; height:14px; border-radius:50%; border:2px solid var(--muted); opacity:.7; transition:all .3s; }
.pt.ocu { background:var(--accent); border-color:var(--accent); opacity:1; }
.pt.admin { background:var(--text); border-color:var(--text); opacity:1; }
.pago b { color:var(--text); }
.miembros { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
.miembros li { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; background:var(--surface2); border-left:3px solid var(--st); }
.miembros li > div { flex:1; min-width:0; display:flex; flex-direction:column; }
.miembros li.vacia { border-left-color:var(--line); }

/* ───── Movimientos y calendario ───── */
.cal { padding:12px; }
.sem, .dias { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; }
.sem { margin:6px 0 2px; font-size:.72rem; color:var(--muted); font-weight:700; }
.dia { position:relative; aspect-ratio:1/1.05; margin:2px; border:2px solid transparent; border-radius:12px; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; transition:transform .12s, background .2s; }
.dia:active { transform:scale(.88); }
.dia.fuera { opacity:.35; }
.dia.hoy { border-color:var(--accent); }
.dia.sel { background:var(--grad); color:var(--on-accent); }
.dia i { display:flex; gap:2px; min-height:6px; }
.p-i,.p-g,.p-v { display:inline-block; width:6px; height:6px; border-radius:50%; }
.p-i { background:var(--accent-soft); } .p-g { background:var(--danger); } .p-v { background:var(--hoy); }
.dia.sel .p-i, .dia.sel .p-g, .dia.sel .p-v { box-shadow:0 0 0 1.5px var(--on-accent); }
.leyenda { display:flex; justify-content:center; gap:16px; margin-top:8px; font-size:.75rem; color:var(--muted); }
.leyenda span { display:inline-flex; align-items:center; gap:5px; }
.cobros { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.mov { display:flex; flex-direction:column; gap:8px; padding:10px 12px; }
.mov-top { display:flex; align-items:center; gap:10px; min-width:0; }
.mov-acc { display:flex; justify-content:flex-start; padding-right:64px; align-items:center; gap:8px; border-top:1px solid var(--line); padding-top:8px; }
.mov-btn { min-height:36px; padding:0 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--text); font-size:.85rem; }
.mov-btn:active { transform:scale(.96); }
.mov-btn.peligro { color:var(--danger); border-color:color-mix(in srgb,var(--danger) 45%,var(--line)); }
.mov-ic { width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:50%; font-weight:800; }
.mov-ic.ing { background:color-mix(in srgb,var(--ok) 18%,transparent); color:var(--ok); }
.mov-ic.gas { background:color-mix(in srgb,var(--danger) 18%,transparent); color:var(--danger); }
.mov-info { flex:1; min-width:0; display:flex; flex-direction:column; }
.mov-info b, .mov-info small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mov-der b.ing { color:var(--ok); } .mov-der b.gas { color:var(--danger); }
.mov-der b { white-space:nowrap; font-size:.95rem; }

/* ───── Más (ajustes) ───── */
.sec { padding:0; overflow:hidden; }
.sec-cab { width:100%; display:flex; align-items:center; gap:12px; padding:14px; border:0; background:transparent; text-align:left; font-size:1rem; }
.sec-cab span { font-size:1.3rem; } .sec-cab b { flex:1; }
.sec-cab i { font-style:normal; font-size:1.5rem; color:var(--muted); transition:transform .3s; }
.sec.abierto .sec-cab i { transform:rotate(90deg); }
.sec-cuerpo { padding:0 14px; }
.sec.abierto .sec-cuerpo { padding-bottom:16px; }
.sec-cuerpo h3 { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 8px; font-weight:700; }
.nota { color:var(--muted); font-size:.85rem; margin:6px 0; }
.nota b { color:var(--text); }
.temas { display:grid; grid-template-columns:repeat(auto-fill,minmax(136px,1fr)); gap:8px; }
.tema { display:flex; flex-direction:column; gap:2px; text-align:left; padding:12px; border-radius:14px; border:2px solid var(--line); background:var(--tb); color:var(--tt); transition:transform .15s, border-color .2s; }
.tema small { color:var(--tt); opacity:.65; } .tema:active { transform:scale(.95); }
.tema span { display:flex; gap:6px; margin-top:10px; }
.tema i { height:12px; width:42px; border-radius:6px; background:var(--ts); } .tema i.a { width:12px; background:var(--ta); }
.tema.act { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-faint); }
.colores { display:flex; flex-wrap:wrap; gap:10px; }
.color { width:36px; height:36px; border-radius:50%; border:0; background:var(--c); transition:transform .15s; }
.color.act { box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--text); transform:scale(1.05); }
.color:active { transform:scale(.88); }
.tog { width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 0; border:0; background:transparent; text-align:left; }
.tog i { flex:none; width:48px; height:28px; border-radius:14px; background:var(--surface2); border:1px solid var(--line); position:relative; transition:background .25s; }
.tog i::after { content:""; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--muted); transition:transform .28s cubic-bezier(.3,1.5,.5,1), background .25s; }
.tog.on i { background:var(--accent); border-color:transparent; }
.tog.on i::after { transform:translateX(20px); background:#fff; }

/* ───── Formularios ───── */
.form { display:flex; flex-direction:column; gap:12px; }
.campo { display:flex; flex-direction:column; gap:5px; }
.campo > span { font-size:.78rem; color:var(--muted); font-weight:600; }
.campo.en-linea { flex-direction:row; align-items:center; justify-content:space-between; gap:12px; margin-top:8px; }
.campo.en-linea input { width:130px; }
input:not([type=radio]):not([type=file]):not([type=checkbox]), textarea {
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface2); color:var(--text);
  font-size:max(16px,1rem); outline:none; transition:border-color .2s, box-shadow .2s; min-width:0; }
input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-faint); }
input[type=date] { min-height:46px; }
textarea { resize:vertical; }
.dos { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.seg { display:flex; background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px; }
.seg label { flex:1; }
.seg input { position:absolute; opacity:0; pointer-events:none; }
.seg span { display:block; text-align:center; padding:9px 6px; border-radius:9px; font-weight:700; font-size:.88rem; color:var(--muted); transition:all .2s; }
.seg input:checked + span { background:var(--grad); color:var(--on-accent); }
.seg input:focus-visible + span { outline:2px solid var(--accent); }

/* ───── Hojas, diálogos y avisos ───── */
.capa { position:fixed; inset:0; z-index:60; background:rgb(0 0 0 / .55); display:flex; justify-content:center; align-items:flex-end; animation:aparece .2s both; }
.capa.sale { animation:desaparece .2s both; }
@keyframes aparece { from { opacity:0; } } @keyframes desaparece { to { opacity:0; } }
.hoja { width:100%; max-width:var(--ancho); max-height:93dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--panel);
  border:1px solid var(--line); border-bottom:0; border-radius:26px 26px 0 0; padding:8px var(--margen) calc(var(--seg) + 20px);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:0 -10px 40px rgb(0 0 0 / .35); animation:hoja .36s cubic-bezier(.2,.9,.3,1) both; }
.hoja.alta { min-height:68dvh; }
.capa.sale .hoja { animation:hojaSale .22s ease-in both; }
@keyframes hoja { from { transform:translateY(100%); } } @keyframes hojaSale { to { transform:translateY(100%); } }
.agarre { width:42px; height:5px; border-radius:3px; background:var(--muted); opacity:.45; margin:4px auto 6px; }
.hoja-cab { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; position:sticky; top:-8px; padding:4px 0; background:transparent; }
.hoja-cab h2 { font-size:1.2rem; }
.hoja-cab .x { width:34px; height:34px; border-radius:50%; border:0; background:var(--surface2); color:var(--text); }
.hoja h3 { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 8px; }
.capa-dlg { align-items:center; z-index:70; background:rgb(0 0 0 / .6); padding:20px; }
.dlg { width:min(420px,100%); background:var(--panel); border:1px solid var(--line); border-radius:var(--radio); padding:22px;
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:0 24px 60px rgb(0 0 0 / .5), inset 0 1px 0 rgb(255 255 255 / .15); animation:dlg .38s cubic-bezier(.2,1.4,.4,1) both; }
.capa.sale .dlg { animation:dlgSale .17s ease-in both; }
@keyframes dlg { from { opacity:0; transform:scale(.88) translateY(10px); } } @keyframes dlgSale { to { opacity:0; transform:scale(.95); } }
.dlg-cab { display:flex; align-items:center; gap:14px; }
.dlg-cab h2 { font-size:1.15rem; }
.dlg-ic, .toast-ic { flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:1.3rem; font-weight:800; color:var(--tc); background:color-mix(in srgb,var(--tc) 18%,transparent); }
.dlg-txt { color:var(--muted); margin-top:14px; line-height:1.45; }
.dlg-bot { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
#toasts { position:fixed; z-index:80; left:0; right:0; top:calc(var(--top) + 10px); display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 var(--margen); pointer-events:none; }
.toast { pointer-events:auto; width:min(440px,100%); display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radio);
  background:var(--panel); border:1px solid var(--line); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  box-shadow:0 14px 36px rgb(0 0 0 / .4), inset 0 1px 0 rgb(255 255 255 / .15); animation:toastIn .45s cubic-bezier(.2,1.3,.4,1) both; }
.toast .toast-ic { width:36px; height:36px; font-size:1.05rem; }
.toast div { display:flex; flex-direction:column; min-width:0; }
.toast small { word-break:break-word; }
.toast.sale { animation:toastOut .26s ease-in both; }
@keyframes toastIn { from { opacity:0; transform:translateY(-26px) scale(.94); } } @keyframes toastOut { to { opacity:0; transform:translateY(-16px) scale(.96); } }

/* ───── Comprobantes ───── */
.prueba { border:2px dashed var(--line); border-radius:16px; min-height:150px; display:grid; place-items:center; overflow:hidden; background:var(--surface2); }
.prueba img { width:100%; max-height:42dvh; object-fit:contain; display:block; }
.prueba-vacia { display:flex; flex-direction:column; align-items:center; gap:2px; padding:22px; text-align:center; }
.prueba-vacia span { font-size:2rem; }
.galeria { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; }
.miniatura { display:flex; flex-direction:column; gap:4px; padding:0; border:0; background:transparent; text-align:left; }
.miniatura img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; background:var(--surface2); border:1px solid var(--line); }
.miniatura small { font-size:.68rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.miniatura.perdida img { opacity:.25; }
.visor-img { width:100%; max-height:66dvh; object-fit:contain; border-radius:14px; background:var(--surface2); }

@media (prefers-reduced-motion:reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
@media (min-width:700px) { #vista { padding-bottom:130px; } }

.nota.err { color:var(--danger); font-weight:600; }
.nota[hidden] { display:none; }

/* Cargando */
.cargando { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:rgb(0 0 0 / .55); animation:aparece .15s both; padding:16px; }
.cargando-caja { background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:16px; padding:22px 24px; display:flex; flex-direction:column; align-items:center; gap:8px; max-width:320px; text-align:center; box-shadow:0 12px 40px rgb(0 0 0 / .4); }
.cargando-caja small { color:var(--muted); word-break:break-word; }
.rueda { width:34px; height:34px; border-radius:50%; border:4px solid var(--line); border-top-color:var(--accent); animation:gira .8s linear infinite; }
@keyframes gira { to { transform:rotate(360deg); } }

/* ───── Pantalla de inicio: el logo se arma por capas ─────
   1) los cuatro brazos de la X llegan desde las esquinas hacia el centro
   2) la espada cae desde arriba
   3) al golpear, las alas salen disparadas en diagonal y queda el logo completo */
#splash { position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  background:radial-gradient(120% 80% at 50% 38%, color-mix(in srgb,var(--accent) 14%,var(--bg)) 0%, var(--bg) 62%);
  transition:opacity .5s ease, transform .5s ease, visibility .5s; }
#splash.sale { opacity:0; transform:scale(1.06); visibility:hidden; pointer-events:none; }
.sp-logo { position:relative; width:150px; height:150px; margin-bottom:12px; }
.sp-logo.golpe { animation:spGolpe .38s ease-out both; }
.sp-logo.listo { animation:spBrilla 1.6s ease-in-out infinite alternate; }
.sp-logo i { position:absolute; inset:0; background:var(--logo); -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; -webkit-mask-position:center; mask-position:center; -webkit-mask-size:contain; mask-size:contain; }
.sp-logo .sp-fantasma { -webkit-mask-image:var(--logo-img); mask-image:var(--logo-img); opacity:.10; }
.sp-x { opacity:0; animation:spX .95s cubic-bezier(.2,.75,.25,1) forwards; }
.sp-xtl { -webkit-mask-image:var(--sp-xtl); mask-image:var(--sp-xtl); --de:inset(0 100% 100% 0); animation-delay:.15s; }
.sp-xtr { -webkit-mask-image:var(--sp-xtr); mask-image:var(--sp-xtr); --de:inset(0 0 100% 100%); animation-delay:.27s; }
.sp-xbr { -webkit-mask-image:var(--sp-xbr); mask-image:var(--sp-xbr); --de:inset(100% 0 0 100%); animation-delay:.39s; }
.sp-xbl { -webkit-mask-image:var(--sp-xbl); mask-image:var(--sp-xbl); --de:inset(100% 100% 0 0); animation-delay:.51s; }
.sp-espada { -webkit-mask-image:var(--sp-espada); mask-image:var(--sp-espada); opacity:0; animation:spCae .5s cubic-bezier(.55,0,.85,.45) 1.25s forwards; }
.sp-ala { opacity:0; }
.sp-alai { -webkit-mask-image:var(--sp-alai); mask-image:var(--sp-alai); --a0:polygon(50% 97%,50% 97%,50% 97%,50% 97%); --a1:polygon(-2% -2%,52% -2%,52% 102%,-2% 102%); animation:spAla .55s cubic-bezier(.1,.8,.2,1) 1.75s forwards; }
.sp-alad { -webkit-mask-image:var(--sp-alad); mask-image:var(--sp-alad); --a0:polygon(50% 97%,50% 97%,50% 97%,50% 97%); --a1:polygon(48% -2%,102% -2%,102% 102%,48% 102%); animation:spAla .55s cubic-bezier(.1,.8,.2,1) 1.75s forwards; }
.sp-logo .sp-onda { inset:auto; left:50%; top:96%; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; opacity:0;
  background:radial-gradient(circle, #fff 0%, var(--accent-soft) 28%, transparent 68%); animation:spOnda .6s ease-out 1.75s forwards; }
.sp-nombre { font-size:1.9rem; font-weight:800; letter-spacing:.01em; color:var(--accent); opacity:0; transform:translateY(10px); animation:spSube .6s ease 2.35s forwards; }
.sp-sub { font-weight:600; color:var(--muted); opacity:0; transform:translateY(8px); animation:spSube .6s ease 2.55s forwards; }

<script>
/* Utilidades: fechas, números en formato venezolano, texto seguro. */
'use strict';
const B = window.B = {};

/* Versión de la app: súbela aquí y en sw.js (VERSION) cada vez que publiques cambios. */
B.VERSION = '2.2';
B.MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
B.DIAS_CORTOS = ['Lu','Ma','Mi','Ju','Vi','Sá','Do'];

B.uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    }));

B.esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
B.pad = n => String(n).padStart(2, '0');

/* ───── Fechas ─────
   Se guardan como "2026-10-14T00:00:00" (igual que la app de la PC) para que el respaldo sea intercambiable. */
B.hoy = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
B.aIso = d => `${d.getFullYear()}-${B.pad(d.getMonth() + 1)}-${B.pad(d.getDate())}T00:00:00`;
B.aInput = d => `${d.getFullYear()}-${B.pad(d.getMonth() + 1)}-${B.pad(d.getDate())}`;
B.deIso = s => {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
};
B.dias = iso => { const d = B.deIso(iso); return d ? Math.round((d - B.hoy()) / 864e5) : 0; };
B.mismoDia = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
B.addMeses = (d, n) => {
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const ult = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return new Date(t.getFullYear(), t.getMonth(), Math.min(d.getDate(), ult));
};
B.fechaCorta = iso => { const d = B.deIso(iso); return d ? `${B.pad(d.getDate())}/${B.pad(d.getMonth() + 1)}/${d.getFullYear()}` : '—'; };
B.mesAnio = d => `${B.MESES[d.getMonth()]} ${d.getFullYear()}`;
B.diaLargo = d => `${B.pad(d.getDate())} de ${B.MESES[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
B.ahoraIso = () => { const d = new Date(); return `${B.aIso(d).slice(0, 10)}T${B.pad(d.getHours())}:${B.pad(d.getMinutes())}:${B.pad(d.getSeconds())}`; };
B.horaTexto = v => {
  const d = v ? new Date(v) : null;
  if (!d || isNaN(d)) return '';
  let h = d.getHours(); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  return `${B.pad(d.getDate())}/${B.pad(d.getMonth() + 1)} ${h}:${B.pad(d.getMinutes())} ${ap}`;
};

/* ───── Números: 1.234,56 ───── */
B.num = v => {
  const neg = v < 0, [e, d] = Math.abs(v).toFixed(2).split('.');
  return (neg ? '-' : '') + e.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d;
};
B.usd = v => (v < 0 ? '-' : '') + '$ ' + B.num(Math.abs(v));
B.ves = v => (v < 0 ? '-' : '') + 'Bs ' + B.num(Math.abs(v));
B.dinero = (v, m) => m === 'USD' ? B.usd(v) : B.ves(v);
B.tasaTxt = v => { const [e, d] = (Math.round(v * 10000) / 10000).toFixed(4).split('.'); return e.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d; };

/* "1.234,56", "5,5", "5.5" → número. Con miles=false un punto suelto es decimal (para la tasa). */
B.tryNum = (s, miles = true) => {
  if (s == null) return null;
  s = String(s).trim().replace(/\$/g, '').replace(/bs/ig, '').replace(/\s/g, '');
  if (!s) return null;
  const c = s.lastIndexOf(','), p = s.lastIndexOf('.');
  if (c >= 0 && p >= 0) s = c > p ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (c >= 0) s = s.replace(',', '.');
  else if (p >= 0 && miles && /^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
};

B.limpiarNombre = t => {
  const r = String(t ?? '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').trim().replace(/\.+$/, '');
  return r || 'Sin nombre';
};

B.esperar = ms => new Promise(r => setTimeout(r, ms));
B.$ = (s, r = document) => r.querySelector(s);
B.$$ = (s, r = document) => [...r.querySelectorAll(s)];

</script>
<script>
/* Base de datos local (IndexedDB): "kv" guarda datos y ajustes, "pruebas" guarda las imágenes de comprobante. */
'use strict';
B.db = (() => {
  let abierta = null;
  const abrir = () => abierta ||= new Promise((ok, mal) => {
    const r = indexedDB.open('spcontrol', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('pruebas'); };
    r.onsuccess = async () => { try { await migrar(r.result); } catch { } ok(r.result); };
    r.onerror = () => mal(r.error);
  });
  /* Versiones anteriores guardaban todo en una base llamada «bluumxsic»: la primera vez se copia a la nueva (la vieja no se borra). */
  const migrar = async nueva => {
    if (!indexedDB.databases) return;
    if (!(await indexedDB.databases()).some(d => d.name === 'bluumxsic')) return;
    const vacia = await new Promise(ok => { const q = nueva.transaction('kv').objectStore('kv').count(); q.onsuccess = () => ok(q.result === 0); q.onerror = () => ok(false); });
    if (!vacia) return;
    const vieja = await new Promise((ok, mal) => { const r = indexedDB.open('bluumxsic'); r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error); r.onupgradeneeded = () => r.transaction.abort(); });
    try {
      for (const nombre of ['kv', 'pruebas']) {
        if (!vieja.objectStoreNames.contains(nombre)) continue;
        const { claves, valores } = await new Promise((ok, mal) => {
          const o = vieja.transaction(nombre).objectStore(nombre), k = o.getAllKeys(), v = o.getAll();
          v.onsuccess = () => ok({ claves: k.result, valores: v.result }); v.onerror = () => mal(v.error);
        });
        await new Promise((ok, mal) => {
          const t = nueva.transaction(nombre, 'readwrite'), o = t.objectStore(nombre);
          claves.forEach((c, i) => o.put(valores[i], c));
          t.oncomplete = () => ok(); t.onerror = t.onabort = () => mal(t.error);
        });
      }
    } finally { vieja.close(); }
  };
  const tx = async (almacen, modo, fn) => {
    const db = await abrir();
    return new Promise((ok, mal) => {
      const t = db.transaction(almacen, modo);
      const rq = fn(t.objectStore(almacen));
      t.oncomplete = () => ok(rq ? rq.result : undefined);
      t.onerror = t.onabort = () => mal(t.error || new Error('Error de almacenamiento'));
    });
  };
  return {
    get: (a, k) => tx(a, 'readonly', o => o.get(k)),
    set: (a, k, v) => tx(a, 'readwrite', o => o.put(v, k)),
    del: (a, k) => tx(a, 'readwrite', o => o.delete(k)),
    keys: a => tx(a, 'readonly', o => o.getAllKeys()),
    clear: a => tx(a, 'readwrite', o => o.clear()),
  };
})();

</script>
<script>
/* ZIP mínimo, sin librerías: escribe (sin comprimir, las fotos ya vienen comprimidas) y lee (guardado o deflate). */
B.zip = (() => {
  const TABLA = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = TABLA[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const enc = new TextEncoder(), dec = new TextDecoder('utf-8');

  /* Lee un Blob/File a bytes; si el teléfono se resiste, prueba otras vías. */
  const bytes = async blob => {
    const vias = [() => blob.arrayBuffer(), () => new Response(blob).arrayBuffer(),
      () => new Promise((ok, mal) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => mal(fr.error); fr.readAsArrayBuffer(blob); })];
    let ult;
    for (const v of vias) { try { return new Uint8Array(await v()); } catch (e) { ult = e; } }
    throw new Error('No se pudo leer el archivo desde el teléfono (' + (ult?.name || 'error') + '). Cópialo a la carpeta Descargas y vuelve a elegirlo desde ahí.');
  };

  /** entradas: [{ nombre: 'comprobantes/Ana/2026-10 Octubre.jpg', datos: Blob | Uint8Array | string }] → Blob .zip */
  const crear = async entradas => {
    const partes = [], central = [];
    let pos = 0;
    const ahora = new Date();
    const hora = (ahora.getHours() << 11) | (ahora.getMinutes() << 5) | (ahora.getSeconds() >> 1);
    const fecha = ((ahora.getFullYear() - 1980) << 9) | ((ahora.getMonth() + 1) << 5) | ahora.getDate();
    for (const e of entradas) {
      const nombre = enc.encode(e.nombre);
      const origen = typeof e.datos === 'string' ? enc.encode(e.datos) : e.datos;
      const u8 = origen instanceof Uint8Array ? origen : await bytes(origen);
      const crc = crc32(u8), tam = u8.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, hora, true); lh.setUint16(12, fecha, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, tam, true); lh.setUint32(22, tam, true); lh.setUint16(26, nombre.length, true); lh.setUint16(28, 0, true);
      partes.push(lh.buffer, nombre, u8);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
      ch.setUint16(12, hora, true); ch.setUint16(14, fecha, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, tam, true); ch.setUint32(24, tam, true); ch.setUint16(28, nombre.length, true);
      ch.setUint32(42, pos, true);
      central.push(ch.buffer, nombre);
      pos += 30 + nombre.length + tam;
    }
    const tamCentral = central.reduce((s, p) => s + (p.byteLength ?? p.length), 0);
    const fin = new DataView(new ArrayBuffer(22));
    fin.setUint32(0, 0x06054b50, true); fin.setUint16(8, entradas.length, true); fin.setUint16(10, entradas.length, true);
    fin.setUint32(12, tamCentral, true); fin.setUint32(16, pos, true);
    return new Blob([...partes, ...central, fin.buffer], { type: 'application/zip' });
  };

  /** Devuelve [{ nombre, leer(): Promise<Blob> }] */
  const leer = async file => {
    const total = file.size;
    if (total < 22) throw new Error('El archivo es demasiado pequeño para ser un .zip.');
    const colaIni = Math.max(0, total - 66000);
    const cola = await bytes(file.slice(colaIni, total));
    const dv = new DataView(cola.buffer, cola.byteOffset, cola.byteLength);
    let e = -1;
    for (let i = cola.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
    if (e < 0) throw new Error('El .zip está incompleto o dañado (no se encontró su índice). Vuelve a copiarlo.');
    const cuantos = dv.getUint16(e + 10, true), tamC = dv.getUint32(e + 12, true), posC = dv.getUint32(e + 16, true);
    if (posC === 0xFFFFFFFF || cuantos === 0xFFFF) throw new Error('Este .zip es demasiado grande (ZIP64). Divide el respaldo.');
    const c = await bytes(file.slice(posC, posC + tamC));
    const cv = new DataView(c.buffer, c.byteOffset, c.byteLength);
    const lista = [];
    let p = 0;
    for (let i = 0; i < cuantos && p + 46 <= c.length; i++) {
      if (cv.getUint32(p, true) !== 0x02014b50) break;
      const flags = cv.getUint16(p + 8, true), metodo = cv.getUint16(p + 10, true);
      const tamComp = cv.getUint32(p + 20, true), nl = cv.getUint16(p + 28, true), xl = cv.getUint16(p + 30, true), cl = cv.getUint16(p + 32, true);
      const desde = cv.getUint32(p + 42, true);
      const nombre = dec.decode(c.subarray(p + 46, p + 46 + nl)).replace(/\\/g, '/');
      p += 46 + nl + xl + cl;
      if (nombre.endsWith('/')) continue;                       // carpeta
      lista.push({
        nombre, cifrado: !!(flags & 1),
        leer: async () => {
          if (flags & 1) throw new Error('El .zip está protegido con contraseña, y esta versión no lo admite.');
          const lh = await bytes(file.slice(desde, desde + 30));
          const lv = new DataView(lh.buffer, lh.byteOffset, lh.byteLength);
          if (lv.getUint32(0, true) !== 0x04034b50) throw new Error('El .zip está dañado.');
          const ini = desde + 30 + lv.getUint16(26, true) + lv.getUint16(28, true);
          const crudo = file.slice(ini, ini + tamComp);
          if (metodo === 0) return crudo;
          if (metodo === 8) {
            if (typeof DecompressionStream === 'undefined') throw new Error('Este navegador es muy antiguo para abrir el .zip. Actualiza Chrome o Safari.');
            return await new Response(crudo.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
          }
          throw new Error('El .zip usa un método de compresión no admitido (' + metodo + ').');
        },
      });
    }
    return lista;
  };

  return { crear, leer, bytes };
})();

</script>
<script>
/* Respaldo protegido con contraseña.
   Formato .spcontrol (antes .bluumxsic; es el mismo en la app de Windows):
     0-3  "BLXC"   4  versión (1)   5-20  sal (16)   21-24  vueltas PBKDF2 (uint32, big-endian)   25-36  nonce (12)
     37…  datos cifrados + etiqueta (16)  — AES-256-GCM; los primeros 37 bytes van como dato autenticado.
   Clave: PBKDF2-HMAC-SHA256 de la contraseña (UTF-8, normalizada NFC). Dentro va el .zip del respaldo. */
B.cripto = (() => {
  const MAGIA = [0x42, 0x4C, 0x58, 0x43], VER = 1, VUELTAS = 210000, CAB = 37;
  const enc = new TextEncoder();

  const disponible = () => !!(window.crypto && crypto.subtle);
  const esCifrado = u8 => !!u8 && u8.length >= 4 && MAGIA.every((b, i) => u8[i] === b);

  const derivar = async (clave, sal, vueltas) => {
    const base = await crypto.subtle.importKey('raw', enc.encode(String(clave).normalize('NFC')), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: sal, iterations: vueltas },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  };

  /** Blob (.zip) + contraseña → Blob cifrado */
  const cifrar = async (blob, clave) => {
    if (!disponible()) throw new Error('Este navegador no permite cifrar aquí (hace falta abrir la app desde una dirección https).');
    const datos = await B.zip.bytes(blob);
    const cab = new Uint8Array(CAB), dv = new DataView(cab.buffer);
    cab.set(MAGIA, 0); cab[4] = VER;
    cab.set(crypto.getRandomValues(new Uint8Array(16)), 5);
    dv.setUint32(21, VUELTAS, false);
    cab.set(crypto.getRandomValues(new Uint8Array(12)), 25);
    const k = await derivar(clave, cab.slice(5, 21), VUELTAS);
    const cif = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: cab.slice(25, 37), additionalData: cab, tagLength: 128 }, k, datos);
    return new Blob([cab, cif], { type: 'application/octet-stream' });
  };

  /** Bytes cifrados + contraseña → Uint8Array del .zip. Lanza Error con .clave = true si la contraseña no sirve. */
  const descifrar = async (u8, clave) => {
    if (!disponible()) throw new Error('Este navegador no permite descifrar aquí (hace falta abrir la app desde una dirección https).');
    if (u8.length < CAB + 16 || u8[4] !== VER) throw new Error('El archivo protegido está incompleto o es de una versión que esta app no conoce.');
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const vueltas = dv.getUint32(21, false);
    if (vueltas < 10000 || vueltas > 5000000) throw new Error('El archivo protegido está dañado.');
    const cab = u8.slice(0, CAB);
    try {
      const k = await derivar(clave, cab.slice(5, 21), vueltas);
      return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: cab.slice(25, 37), additionalData: cab, tagLength: 128 }, k, u8.subarray(CAB)));
    } catch {
      const e = new Error('Contraseña incorrecta, o el archivo está dañado.'); e.clave = true; throw e;
    }
  };

  return { esCifrado, cifrar, descifrar, disponible };
})();

/* Hoja para escribir la contraseña. nueva = al crear (pide confirmarla y permite "sin contraseña");
   validar(clave) devuelve true o un texto de error (se usa al abrir, para reintentar sin cerrar). Devuelve '' (sin clave), la clave o null (cancelado). */
B.pedirClave = ({ titulo, intro, nueva = false, validar = null }) => new Promise(res => {
  let hecho = false;
  const h = B.sheet(titulo, `
    <form id="f-clave" class="form" novalidate autocomplete="off">
      <p class="nota">${intro}</p>
      <label class="campo"><span>${nueva ? 'Contraseña' : 'Contraseña del respaldo'}</span><input name="c1" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false"></label>
      ${nueva ? '<label class="campo"><span>Repite la contraseña</span><input name="c2" type="password" autocomplete="new-password" autocapitalize="none" spellcheck="false"></label>' : ''}
      <label class="interruptor"><input type="checkbox" id="ver-clave"><span>Mostrar la contraseña</span></label>
      <p class="nota err" id="clave-err" hidden></p>
      ${nueva ? '<p class="nota"><b>Guárdala bien:</b> si la olvidas, nadie podrá abrir ese respaldo (ni yo ni la app).</p>' : ''}
      <div class="acciones fin">
        <button type="button" class="btn fantasma" data-cerrar>Cancelar</button>
        <button type="submit" class="btn" id="ok-clave">${nueva ? 'Guardar con contraseña' : 'Abrir'}</button>
      </div>
    </form>`, { alCerrar: () => { if (!hecho) { hecho = true; res(null); } } });
  const f = h.$('#f-clave'), err = h.$('#clave-err');
  const mostrarErr = t => { err.textContent = t; err.hidden = !t; };
  const cerrar = v => { if (hecho) return; hecho = true; res(v); h.cerrar(); };
  h.$('#ver-clave').addEventListener('change', ev => { f.c1.type = ev.target.checked ? 'text' : 'password'; if (f.c2) f.c2.type = f.c1.type; });
  setTimeout(() => f.c1.focus(), 250);
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const c = f.c1.value;
    if (!c) { mostrarErr('Escribe la contraseña.'); return; }
    if (nueva) {
      if (c.length < 6) { mostrarErr('Usa al menos 6 caracteres.'); return; }
      if (c !== f.c2.value) { mostrarErr('Las dos contraseñas no coinciden.'); return; }
    }
    if (validar) {
      const b = h.$('#ok-clave'); b.disabled = true; b.textContent = 'Comprobando…';
      const r = await validar(c);
      b.disabled = false; b.textContent = 'Abrir';
      if (r !== true) { mostrarErr(r); f.c1.select(); return; }
    }
    cerrar(c);
  });
});

];

  ['Redondeada', 'ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,sans-serif'],
  ['Clásica', '"Helvetica Neue",Helvetica,Arial,sans-serif'],
  ['Humanista', '"Trebuchet MS","Gill Sans",Verdana,sans-serif'],

];

  fuente: 'Sistema', escala: 100, margen: 16, mostrarTasa: true, toast: 4,
};

B.color = {
  parse(hex, resp) {
    const ok = h => /^#?[0-9a-f]{6}$/i.test((h || '').trim()) ? h.trim().replace('#', '') : null;
    const h = ok(hex) || ok(resp) || '808080';
    return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
  },
  esValido: hex => /^#?[0-9a-f]{6}$/i.test((hex || '').trim()),
  mezcla: (a, b, t) => ({ r: Math.round(a.r + (b.r - a.r) * t), g: Math.round(a.g + (b.g - a.g) * t), b: Math.round(a.b + (b.b - a.b) * t) }),
  css: (c, a = 1) => a >= 1 ? `rgb(${c.r} ${c.g} ${c.b})` : `rgb(${c.r} ${c.g} ${c.b} / ${a})`,
  hex: c => '#' + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase(),
  aHsv(c) {
    const r = c.r / 255, g = c.g / 255, b = c.b / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d > 0) { h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
    return { h, s: mx ? d / mx : 0, v: mx };
  },
  deHsv(h, s, v) {
    h = ((h % 360) + 360) % 360;
    const c = v * s, x = c * (1 - Math.abs(h / 60 % 2 - 1)), m = v - c;
    const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
    return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
  },
};

B.oscuro = true;

B.aplicarTema = () => {
  const a = B.aj, p = B.PRESETS.find(x => x.n === a.preset) || B.PRESETS[0];
  const K = B.color, root = document.documentElement, set = (k, v) => root.style.setProperty(k, v);
  B.oscuro = p.o;
  const ac = K.parse(a.acento, p.ac), txt = K.parse(p.text);
  const blanco = { r: 255, g: 255, b: 255 }, negro = { r: 0, g: 0, b: 0 };
  const cristal = !!a.cristal, nivel = Math.min(2, Math.max(0, a.nivel | 0));

  const s = K.parse(p.s), s2 = K.parse(p.s2), side = K.parse(p.side), bg = K.parse(p.bg);
  if (!cristal) {
    set('--bg', K.css(bg)); set('--side', K.css(side)); set('--surface', K.css(s)); set('--surface2', K.css(s2));
    set('--line', K.css(K.parse(p.line))); set('--panel', K.css(s));
    set('--radio', '16px'); set('--blur', 'none');
  } else {
    const a1 = [0.62, 0.46, 0.30][nivel], a2 = [0.78, 0.62, 0.46][nivel];
    const velo = p.o ? K.mezcla(s, blanco, .10) : blanco, velo2 = p.o ? K.mezcla(s2, blanco, .14) : K.mezcla(s2, blanco, .5);
    set('--bg', K.css(bg)); set('--side', K.css(side, a1 * .85));
    set('--surface', K.css(velo, a1)); set('--surface2', K.css(velo2, a2 * (p.o ? .75 : 1)));
    set('--panel', K.css(velo, p.o ? .88 : .94));
    set('--line', p.o ? 'rgb(255 255 255 / .20)' : 'rgb(255 255 255 / .85)');
    set('--radio', '24px');
    set('--blur', `blur(${[14, 22, 30][nivel]}px) saturate(165%)`);
  }
  set('--text', K.css(txt)); set('--muted', K.css(K.parse(p.muted)));
  set('--rowalt', p.o ? 'rgb(255 255 255 / .05)' : 'rgb(0 0 0 / .04)');
  set('--accent', K.css(ac)); set('--accent-soft', K.css(K.mezcla(ac, blanco, .35)));
  set('--accent-deep', K.css(K.mezcla(ac, negro, .45))); set('--accent-faint', K.css(ac, .2));
  const lum = (0.299 * ac.r + 0.587 * ac.g + 0.114 * ac.b) / 255;
  set('--on-accent', lum > .55 ? '#101010' : '#ffffff');
  set('--grad', `linear-gradient(135deg, ${K.css(ac)}, ${K.css(K.mezcla(ac, negro, .30))})`);
  set('--ok', p.o ? '#1ED760' : '#16A34A'); set('--warn', p.o ? '#FFD60A' : '#B88700');
  set('--hoy', p.o ? '#FF8A1F' : '#E26A00'); set('--danger', p.o ? '#FF4D5E' : '#D92D3F');
  set('--logo', K.css(K.esValido(a.logoColor) ? K.parse(a.logoColor) : ac));

  // orbes de color detrás del cristal
  const hv = K.aHsv(ac), ao = p.o ? .55 : .42;
  set('--orbe-a', K.css(ac, ao));
  set('--orbe-b', K.css(K.deHsv(hv.h + 45, Math.max(hv.s, .55), Math.max(hv.v, .85)), ao));
  set('--orbe-c', K.css(K.deHsv(hv.h - 55, Math.max(hv.s, .55), Math.max(hv.v, .8)), ao));

  // fuente, tamaño y márgenes
  const f = B.FUENTES.find(x => x[0] === a.fuente) || B.FUENTES[0];
  set('--fuente', f[1]);
  set('--escala', String(Math.min(140, Math.max(80, a.escala | 0)) / 100));
  set('--margen', Math.min(32, Math.max(8, a.margen | 0)) + 'px');
  root.style.fontSize = (16 * Math.min(140, Math.max(80, a.escala | 0)) / 100) + 'px';

  root.dataset.cristal = cristal ? '1' : '0';
  root.dataset.orbes = cristal && a.animado ? '1' : '0';
  root.dataset.modo = p.o ? 'oscuro' : 'claro';
  root.style.colorScheme = p.o ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', K.hex(bg));
};

<script>
/* Mensajes propios de la app: avisos emergentes (toast), diálogos de confirmación y hojas inferiores. Nada de alert()/confirm() del navegador. */
'use strict';

B.TIPOS = {
  Exito:    { icono: '✔', color: 'var(--ok)' },
  Error:    { icono: '✖', color: 'var(--danger)' },
  Peligro:  { icono: '!', color: 'var(--danger)' },
  Aviso:    { icono: '!', color: 'var(--warn)' },
  Pregunta: { icono: '?', color: 'var(--accent)' },
  Info:     { icono: 'i', color: 'var(--accent)' },
};

/* ───── Toast ───── */
B.toast = (titulo, texto = '', tipo = 'Exito') => {
  const cont = document.getElementById('toasts'), t = B.TIPOS[tipo] || B.TIPOS.Info;
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.setProperty('--tc', t.color);
  el.innerHTML = `<span class="toast-ic">${t.icono}</span><div><b>${B.esc(titulo)}</b>${texto ? `<small>${B.esc(texto)}</small>` : ''}</div>`;
  const quitar = () => {
    if (!el.isConnected) return;
    el.classList.add('sale');
    setTimeout(() => el.remove(), 260);
  };
  el.addEventListener('click', quitar);
  cont.appendChild(el);
  while (cont.children.length > 3) cont.firstElementChild.remove();
  setTimeout(quitar, Math.max(2, (B.aj && B.aj.toast) || 4) * 1000);
  return quitar;
};

/* ───── Cargando: pantalla con ruedita mientras se hace algo largo (queda por debajo de los cuadros) ───── */
B.cargando = (titulo, texto = '') => {
  const el = document.createElement('div');
  el.className = 'cargando';
  el.setAttribute('role', 'status');
  el.innerHTML = `<div class="cargando-caja"><span class="rueda"></span><b></b><small></small></div>`;
  const b = el.querySelector('b'), sm = el.querySelector('small');
  b.textContent = titulo; sm.textContent = texto;
  document.body.appendChild(el);
  return {
    texto: (t, x = '') => { b.textContent = t; sm.textContent = x; },
    cerrar: () => { el.remove(); },
  };
};

/* ───── Diálogo (devuelve una promesa con true/false) ───── */
B.dialogo = ({ titulo, texto = '', tipo = 'Info', si = 'Aceptar', no = null, peligro = false }) => new Promise(res => {
  const capas = document.getElementById('capas'), t = B.TIPOS[tipo] || B.TIPOS.Info;
  const el = document.createElement('div');
  el.className = 'capa capa-dlg';
  el.innerHTML = `
    <div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
      <div class="dlg-cab">
        <span class="dlg-ic" style="--tc:${t.color}">${t.icono}</span>
        <h2 id="dlg-t">${B.esc(titulo)}</h2>
      </div>
      ${texto ? `<p class="dlg-txt">${B.esc(texto).replace(/\n/g, '<br>')}</p>` : ''}
      <div class="dlg-bot">
        ${no ? `<button class="btn fantasma" data-r="0">${B.esc(no)}</button>` : ''}
        <button class="btn ${peligro ? 'peligro' : ''}" data-r="1">${B.esc(si)}</button>
      </div>
    </div>`;
  const teclas = e => { if (e.key === 'Escape') cerrar(false); };
  let cerrado = false;
  const cerrar = v => {
    if (cerrado) return; cerrado = true;
    document.removeEventListener('keydown', teclas);
    el.classList.add('sale');
    setTimeout(() => { el.remove(); res(v); }, 170);
  };
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-r]');
    if (b) cerrar(b.dataset.r === '1');
    else if (e.target === el && no) cerrar(false);
  });
  document.addEventListener('keydown', teclas);
  capas.appendChild(el);
  (el.querySelector('[data-r="1"]')).focus({ preventScroll: true });
});

B.confirmar = (titulo, texto, o = {}) => B.dialogo({
  titulo, texto, tipo: o.peligro ? 'Peligro' : 'Pregunta', si: o.si || 'Aceptar', no: o.no || 'Cancelar', peligro: !!o.peligro,
});
B.info = (texto, titulo = 'SP-Control', tipo = 'Info') => B.dialogo({ titulo, texto, tipo, si: 'Entendido' });
B.aviso = texto => B.info(texto, 'Revisa esto', 'Aviso');
B.error = texto => B.info(texto, 'Algo salió mal', 'Error');

/* ───── Hoja inferior (formularios). El botón "atrás" del teléfono la cierra. ───── */
B._hojas = [];
B._ignorarPop = 0;
window.addEventListener('popstate', () => {
  if (B._ignorarPop > 0) { B._ignorarPop--; return; }
  const h = B._hojas[B._hojas.length - 1];
  if (h) h.cerrar(true);
});

B.sheet = (titulo, html, o = {}) => {
  const capas = document.getElementById('capas');
  const el = document.createElement('div');
  el.className = 'capa capa-hoja';
  el.innerHTML = `
    <div class="hoja ${o.alta ? 'alta' : ''}" role="dialog" aria-modal="true" aria-label="${B.esc(titulo)}">
      <div class="agarre"></div>
      <div class="hoja-cab"><h2>${B.esc(titulo)}</h2><button class="x" data-cerrar aria-label="Cerrar">✕</button></div>
      <div class="hoja-cuerpo">${html}</div>
    </div>`;
  let cerrada = false;
  const h = {
    el, cuerpo: el.querySelector('.hoja-cuerpo'),
    $: s => el.querySelector(s), $$: s => [...el.querySelectorAll(s)],
    cerrar(desdePop = false) {
      if (cerrada) return; cerrada = true;
      B._hojas = B._hojas.filter(x => x !== h);
      el.classList.add('sale');
      setTimeout(() => el.remove(), 230);
      if (!desdePop) { B._ignorarPop++; history.back(); }
      if (o.alCerrar) o.alCerrar();
    },
  };
  el.addEventListener('click', e => {
    if (e.target === el || e.target.closest('[data-cerrar]')) h.cerrar();
  });
  capas.appendChild(el);
  B._hojas.push(h);
  history.pushState({ hoja: 1 }, '');
  return h;
};

/* Lee los campos con name="" de un contenedor. */
B.leer = cont => {
  const r = {};
  cont.querySelectorAll('[name]').forEach(i => {
    if (i.type === 'radio') { if (i.checked) r[i.name] = i.value; }
    else if (i.type === 'checkbox') r[i.name] = i.checked;
    else r[i.name] = i.value;
  });
  return r;
};

</script>
<script>
/* Lógica del negocio: datos, estados de pago, clientes, planes, movimientos, comprobantes, tasa BCV, avisos y respaldo.
   Los datos usan los mismos nombres de campo que la app de Windows para que el respaldo .json sea intercambiable. */
'use strict';

B.EXT_OK = ['.png', '.jpg', '.jpeg', '.webp', '.bmp', '.gif'];
B.MAX_PERSONAS = 6;

/* ───────────── Carga y guardado ───────────── */
B.datosBase = () => ({
  Clientes: [], Movimientos: [], Planes: [], Pruebas: [],
  Tasa: 0, TasaActualizada: null, AutoActualizar: true,
  AvisosActivos: true, AvisoHora: 9, DiasCerca: 3, UltimoAviso: null,
});

B.normalizar = (src = {}) => {
  const d = Object.assign(B.datosBase(), src);
  for (const k of ['Clientes', 'Movimientos', 'Planes', 'Pruebas']) if (!Array.isArray(d[k])) d[k] = [];
  d.Tasa = Number(d.Tasa) || 0;
  d.DiasCerca = Number.isInteger(d.DiasCerca) && d.DiasCerca >= 0 ? d.DiasCerca : 3;
  d.AvisoHora = Number.isInteger(d.AvisoHora) && d.AvisoHora >= 0 && d.AvisoHora <= 23 ? d.AvisoHora : 9;
  for (const c of d.Clientes) {
    c.Id ||= B.uuid();
    c.Nombre ||= ''; c.Telefono ||= ''; c.Notas ||= ''; c.Moneda = c.Moneda === 'VES' ? 'VES' : 'USD';
    c.Monto = Number(c.Monto) || 0;
    c.Cuentas = Math.max(1, c.Cuentas | 0);
    if (!Array.isArray(c.Usuarios)) c.Usuarios = [];
    if (!c.Usuarios.length && c.Usuario) c.Usuarios.push(c.Usuario);
    while (c.Usuarios.length < c.Cuentas) c.Usuarios.push('');
    c.Usuario = c.Usuarios[0] || '';
    c.ProximoPago ||= B.aIso(B.hoy());
    c.UltimoPago ||= null; c.Carpeta ||= '';
    // fechas de pago por cuenta (si no, todas las cuentas comparten ProximoPago)
    c.FechasPorCuenta = !!c.FechasPorCuenta && c.Cuentas > 1;
    if (!Array.isArray(c.ProximosPagos)) c.ProximosPagos = [];
    if (!Array.isArray(c.UltimosPagos)) c.UltimosPagos = [];
    while (c.ProximosPagos.length < c.Cuentas) c.ProximosPagos.push(c.ProximoPago);
    while (c.UltimosPagos.length < c.Cuentas) c.UltimosPagos.push(c.UltimoPago);
    c.ProximosPagos.length = c.Cuentas; c.UltimosPagos.length = c.Cuentas;
    B.sincronizar(c);
  }
  for (const p of d.Planes) {
    p.Id ||= B.uuid();
    p.Admin ||= ''; p.Cuenta ||= ''; p.Moneda = p.Moneda === 'VES' ? 'VES' : 'USD';
    p.Monto = Number(p.Monto) || 0;
    p.ProximoPago ||= B.aIso(B.hoy()); p.UltimoPago ||= null; p.Carpeta ||= '';
    if (!Array.isArray(p.Asignaciones)) p.Asignaciones = [];
    if (Array.isArray(p.Miembros) && p.Miembros.length && !p.Asignaciones.length)
      p.Asignaciones = p.Miembros.map(id => ({ ClienteId: id, Indice: 0 }));   // formato antiguo
    p.Miembros = [];
  }
  for (const m of d.Movimientos) {
    m.Id ||= B.uuid(); m.Monto = Number(m.Monto) || 0; m.Tasa = Number(m.Tasa) || 0;
    m.Moneda = m.Moneda === 'VES' ? 'VES' : 'USD'; m.Tipo = m.Tipo === 'Gasto' ? 'Gasto' : 'Ingreso';
    m.Descripcion ||= ''; m.ClienteId ||= null; m.Prueba ||= null;
  }
  return d;
};

B.cargar = async () => {
  let d = null, a = null;
  try { d = await B.db.get('kv', 'datos'); a = await B.db.get('kv', 'ajustes'); }
  catch (e) { B.sinAlmacen = true; }
  B.d = B.normalizar(d || {});
  B.aj = Object.assign({}, B.AJ_DEF, a || {});
  B.aj.nombre = B.AJ_DEF.nombre; B.aj.sub = B.AJ_DEF.sub; B.aj.logo = true;   // nombre fijo: ya no se edita desde Ajustes
};

B.guardar = () => B.db.set('kv', 'datos', B.d).catch(() =>
  B.error('No se pudieron guardar los datos en este teléfono. Revisa el espacio disponible o que el navegador no esté en modo privado.'));
B.guardarAj = () => B.db.set('kv', 'ajustes', B.aj).catch(() => { });

/* ───────────── Estados de pago ───────────── */
B.estadoDe = dias => dias < 0 ? 'Debe' : dias === 0 ? 'Hoy' : dias <= B.d.DiasCerca ? 'Cerca' : 'Pagado';
B.diasTexto = d => d < 0 ? `${-d} día(s) de retraso` : d === 0 ? 'Hoy' : `En ${d} día(s)`;
B.ESTADO_COLOR = { Debe: 'var(--danger)', Hoy: 'var(--hoy)', Cerca: 'var(--warn)', Pagado: 'var(--ok)' };

B.cDias = c => B.dias(c.ProximoPago);
B.cEstado = c => B.estadoDe(B.cDias(c));
B.cEstadoTexto = c => ({ Debe: '✖ Debe', Hoy: '● Vence hoy', Cerca: '◔ Por vencer' }[B.cEstado(c)] || (c.UltimoPago ? '✔ Pagado' : '✔ Al día'));
/* Con «fechas por cuenta», ProximoPago/UltimoPago guardan la más próxima / la última de todas. */
B.porCuenta = c => !!c.FechasPorCuenta && c.Cuentas > 1;
B.sincronizar = c => {
  if (!B.porCuenta(c)) return;
  const f = c.ProximosPagos.slice(0, c.Cuentas).filter(Boolean).sort();
  if (f.length) c.ProximoPago = f[0];
  const u = c.UltimosPagos.slice(0, c.Cuentas).filter(Boolean).sort();
  c.UltimoPago = u.length ? u[u.length - 1] : null;
};
B.cFecha = (c, i) => (B.porCuenta(c) && c.ProximosPagos[i]) || c.ProximoPago;
B.cDiasC = (c, i) => B.dias(B.cFecha(c, i));
B.cEstadoC = (c, i) => B.estadoDe(B.cDiasC(c, i));
B.estadoTextoDe = (est, pagado) => ({ Debe: '✖ Debe', Hoy: '● Vence hoy', Cerca: '◔ Por vencer' }[est] || (pagado ? '✔ Pagado' : '✔ Al día'));
B.cobraEl = (c, d) => B.porCuenta(c) ? c.ProximosPagos.slice(0, c.Cuentas).some(f => B.mismoDia(B.deIso(f), d)) : B.mismoDia(B.deIso(c.ProximoPago), d);
B.iUrgente = c => { let m = 0; for (let i = 1; i < c.Cuentas; i++) if (B.cFecha(c, i) < B.cFecha(c, m)) m = i; return m; };
/* Pagos que vencen en los próximos N días (una entrada por cuenta cuando tienen fechas distintas). */
B.cobrosProximos = max => {
  const r = [];
  for (const c of B.d.Clientes) {
    if (B.porCuenta(c)) { for (let i = 0; i < c.Cuentas; i++) if (B.cDiasC(c, i) <= max) r.push({ c, i, fecha: B.cFecha(c, i) }); }
    else if (B.cDias(c) <= max) r.push({ c, i: null, fecha: c.ProximoPago });
  }
  return r.sort((a, b) => a.fecha.localeCompare(b.fecha) || a.c.Nombre.localeCompare(b.c.Nombre));
};
B.pEstadoTexto = p => ({ Debe: '✖ Plan vencido', Hoy: '● Se paga hoy', Cerca: '◔ Por pagar' }[B.estadoDe(B.dias(p.ProximoPago))] || '✔ Plan pagado');

B.nombreCuenta = (c, i) => (c.Usuarios[i] && c.Usuarios[i].trim()) ? '@' + c.Usuarios[i].trim().replace(/^@+/, '') : `Cuenta ${i + 1} (sin usuario)`;
B.usuariosTexto = c => c.Usuarios.slice(0, Math.max(1, c.Cuentas)).filter(u => u && u.trim()).map(u => '@' + u.trim().replace(/^@+/, '')).join(', ');
B.cuentasTexto = c => c.Cuentas === 1 ? '1 cuenta' : `${c.Cuentas} cuentas`;
B.cSub = c => [B.usuariosTexto(c), B.cuentasTexto(c), c.Telefono].filter(Boolean).join(' · ');

B.planDeCuenta = (c, i) => B.d.Planes.find(p => p.Asignaciones.some(a => a.ClienteId === c.Id && a.Indice === i));
B.ocupados = p => 1 + p.Asignaciones.length;
B.libres = p => Math.max(0, B.MAX_PERSONAS - B.ocupados(p));
B.cliente = id => B.d.Clientes.find(c => c.Id === id);

B.mUsd = m => m.Moneda === 'USD' ? m.Monto : (m.Tasa > 0 ? m.Monto / m.Tasa : 0);
B.mVes = m => m.Moneda === 'VES' ? m.Monto : m.Monto * m.Tasa;
B.aUsd = (v, mon) => mon === 'USD' ? v : (B.d.Tasa > 0 ? v / B.d.Tasa : 0);
B.aVes = (v, mon) => mon === 'VES' ? v : v * B.d.Tasa;

/* ───────────── Carpetas y comprobantes ───────────── */
B.carpetasUsadas = async () => {
  const s = new Set();
  for (const c of B.d.Clientes) if (c.Carpeta) s.add(c.Carpeta.toLowerCase());
  for (const p of B.d.Planes) if (p.Carpeta) s.add(p.Carpeta.toLowerCase());
  for (const k of await B.db.keys('pruebas')) s.add(String(k).split('/').slice(0, -1).join('/').toLowerCase());
  return s;
};

/* Una carpeta por cliente (y "_Planes/" para los administradores), sin repetir nombres. */
B.crearCarpeta = async (nombre, detalle, padre) => {
  const base = B.limpiarNombre(detalle && detalle.trim() ? `${nombre} (${detalle.trim().replace(/^@+/, '')})` : nombre);
  const ruta = n => padre ? `${padre}/${n}` : n, usadas = await B.carpetasUsadas();
  let rel = ruta(base);
  for (let i = 2; usadas.has(rel.toLowerCase()); i++) rel = ruta(`${base} (${i})`);
  return rel;
};

B.extension = f => {
  const m = /\.[a-z0-9]+$/i.exec(f.name || '');
  if (m && B.EXT_OK.includes(m[0].toLowerCase())) return m[0].toLowerCase();
  const t = (f.type || '').toLowerCase();
  return t === 'image/png' ? '.png' : t === 'image/webp' ? '.webp' : t === 'image/gif' ? '.gif' : t === 'image/bmp' ? '.bmp' : t.startsWith('image/') ? '.jpg' : '';
};

B.esImagen = f => !!f && ((f.type || '').startsWith('image/') || B.EXT_OK.includes((/\.[a-z0-9]+$/i.exec(f.name || '') || [''])[0].toLowerCase()));

/* Las fotos del teléfono pesan varios MB: se reducen para que el respaldo no sea enorme. */
B.comprimir = async (file, max = 1800, q = .85) => {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(bmp.width * k)); cv.height = Math.max(1, Math.round(bmp.height * k));
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    if (bmp.close) bmp.close();
    return await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
  } catch { return null; }
};

B.nombrePrueba = (periodo, ext, usados) => {
  const base = `${periodo.getFullYear()}-${B.pad(periodo.getMonth() + 1)} ${B.MESES[periodo.getMonth()]}`;
  let n = base + ext;
  for (let i = 2; usados.has(n.toLowerCase()); i++) n = `${base} (${i})${ext}`;
  return n;
};

/* Guarda la imagen con el nombre del mes al que pertenece el pago: "2026-10 Octubre.jpg". */
B.guardarPrueba = async (file, carpeta, titular, periodo, clienteId, planId) => {
  if (!B.esImagen(file)) throw new Error('El archivo debe ser una imagen (png, jpg, webp, bmp o gif).');
  let blob = file, ext = B.extension(file) || '.jpg';
  if (file.size > 1.6e6 || !B.extension(file)) {
    const c = await B.comprimir(file);
    if (c && (c.size < file.size || !B.extension(file))) { blob = c; ext = '.jpg'; }
  }
  const claves = await B.db.keys('pruebas');
  const usados = new Set(claves.filter(k => String(k).startsWith(carpeta + '/')).map(k => String(k).slice(carpeta.length + 1).toLowerCase()));
  const nombre = B.nombrePrueba(periodo, ext, usados);
  const clave = `${carpeta}/${nombre}`;
  await B.db.set('pruebas', clave, blob);
  const reg = {
    Id: B.uuid(), Titular: titular, ClienteId: clienteId || null, PlanId: planId || null,
    Archivo: clave, Original: file.name || 'foto', Periodo: `${periodo.getFullYear()}-${B.pad(periodo.getMonth() + 1)}`,
    FechaPago: B.aIso(B.hoy()),
  };
  B.d.Pruebas.push(reg);
  return reg;
};

B.nombreArchivo = ruta => String(ruta || '').split('/').pop();

/* ───────────── Clientes ───────────── */
B.validarCliente = (f, usuarios, fechas = []) => {
  if (!f.Nombre.trim()) return 'Escribe el nombre del cliente.';
  const cuentas = parseInt(String(f.Cuentas).trim(), 10);
  if (!(cuentas >= 1 && cuentas <= 20)) return 'Escribe cuántas cuentas alquila (de 1 a 20).';
  const us = usuarios.slice(0, cuentas).map(u => u.trim().replace(/^@+/, '').toLowerCase()).filter(Boolean);
  if (new Set(us).size !== us.length) return 'Dos cuentas tienen el mismo usuario. Cada cuenta debe tener el suyo.';
  const m = B.tryNum(f.Monto);
  if (!(m > 0)) return 'Escribe el monto que paga (mayor que cero).';
  if (!B.deIso(f.ProximoPago)) return 'Elige la próxima fecha de pago.';
  if (f.FechasPorCuenta && cuentas > 1)
    for (let i = 0; i < cuentas; i++) if (!B.deIso(fechas[i])) return `Elige la fecha de pago de la cuenta ${i + 1}.`;
  return null;
};

B.guardarCliente = async (f, usuarios, editId, fechas = []) => {
  const cuentas = parseInt(String(f.Cuentas).trim(), 10);
  const porCuenta = !!f.FechasPorCuenta && cuentas > 1;
  const base = B.aIso(B.deIso(f.ProximoPago));
  const proximos = Array.from({ length: cuentas }, (_, i) => porCuenta ? B.aIso(B.deIso(fechas[i])) : base);
  const datos = {
    FechasPorCuenta: porCuenta, ProximosPagos: proximos,
    Nombre: f.Nombre.trim(), Telefono: f.Telefono.trim(), Notas: f.Notas.trim(),
    Cuentas: cuentas, Usuarios: usuarios.slice(0, cuentas).map(u => u.trim().replace(/^@+/, '')),
    Monto: B.tryNum(f.Monto), Moneda: f.Moneda === 'VES' ? 'VES' : 'USD',
    ProximoPago: [...proximos].sort()[0],
  };
  datos.Usuario = datos.Usuarios[0] || '';
  if (editId) {
    const c = B.cliente(editId);
    const ult = Array.from({ length: cuentas }, (_, i) => (c.UltimosPagos && c.UltimosPagos[i]) || (i >= (c.UltimosPagos || []).length ? c.UltimoPago : null) || null);
    Object.assign(c, datos, { UltimosPagos: ult });
    // si ahora alquila menos cuentas, se sueltan las que sobran en los planes
    for (const p of B.d.Planes) p.Asignaciones = p.Asignaciones.filter(a => a.ClienteId !== c.Id || a.Indice < c.Cuentas);
  } else {
    B.d.Clientes.push(Object.assign({ Id: B.uuid(), UltimoPago: null, Carpeta: '', UltimosPagos: Array(cuentas).fill(null) }, datos));
  }
  B.d.Clientes.forEach(c => { while (c.Usuarios.length < c.Cuentas) c.Usuarios.push(''); B.sincronizar(c); });
  await B.guardar();
};

B.eliminarCliente = async c => {
  B.d.Clientes = B.d.Clientes.filter(x => x.Id !== c.Id);
  for (const p of B.d.Planes) p.Asignaciones = p.Asignaciones.filter(a => a.ClienteId !== c.Id);
  await B.guardar();
};

B.registrarPagoCliente = async (c, file, i = null) => {
  const porCuenta = B.porCuenta(c) && i !== null && i >= 0 && i < c.Cuentas;
  const periodo = B.deIso(porCuenta ? B.cFecha(c, i) : c.ProximoPago), nuevo = B.addMeses(periodo, 1);
  if (!c.Carpeta) c.Carpeta = await B.crearCarpeta(c.Nombre, (c.Usuarios[0] || '').trim());
  const reg = await B.guardarPrueba(file, c.Carpeta, c.Nombre, periodo, c.Id, null);
  const us = B.usuariosTexto(c);
  B.d.Movimientos.push({
    Id: B.uuid(), Fecha: B.aIso(B.hoy()), Tipo: 'Ingreso',
    Descripcion: porCuenta ? `Pago ${c.Nombre} (${B.nombreCuenta(c, i)}) · cuenta ${i + 1} de ${c.Cuentas}`
      : `Pago ${c.Nombre}${us ? ` (${us})` : ''} · ${B.cuentasTexto(c)}`,
    Monto: c.Monto, Moneda: c.Moneda, Tasa: B.d.Tasa, ClienteId: c.Id, CuentaIndice: porCuenta ? i : null, Prueba: reg.Archivo,
  });
  if (porCuenta) {
    c.ProximosPagos[i] = B.aIso(nuevo); c.UltimosPagos[i] = B.aIso(B.hoy());
    B.sincronizar(c);
  } else {
    c.UltimoPago = B.aIso(B.hoy());
    c.ProximoPago = B.aIso(nuevo);
    c.ProximosPagos = Array(c.Cuentas).fill(c.ProximoPago);
  }
  await B.guardar();
  return reg;
};

/* ───────────── Planes familiares ───────────── */
B.validarPlan = f => {
  if (!f.Admin.trim()) return 'Escribe el nombre del administrador del plan.';
  if (!(B.tryNum(f.Monto) > 0)) return 'Escribe cuánto cuesta el plan (mayor que cero).';
  if (!B.deIso(f.ProximoPago)) return 'Elige la fecha en que se paga el plan.';
  return null;
};

B.guardarPlan = async (f, editId) => {
  const datos = {
    Admin: f.Admin.trim(), Cuenta: f.Cuenta.trim(), Monto: B.tryNum(f.Monto),
    Moneda: f.Moneda === 'VES' ? 'VES' : 'USD', ProximoPago: B.aIso(B.deIso(f.ProximoPago)),
  };
  if (editId) Object.assign(B.d.Planes.find(p => p.Id === editId), datos);
  else B.d.Planes.push(Object.assign({ Id: B.uuid(), UltimoPago: null, Carpeta: '', Asignaciones: [], Miembros: [] }, datos));
  await B.guardar();
};

B.cuentasLibres = () => {
  const r = [];
  for (const c of B.d.Clientes) for (let i = 0; i < c.Cuentas; i++) if (!B.planDeCuenta(c, i)) r.push({ c, i });
  return r;
};

B.registrarPagoPlan = async (p, file) => {
  const periodo = B.deIso(p.ProximoPago), nuevo = B.addMeses(periodo, 1);
  if (!p.Carpeta) p.Carpeta = await B.crearCarpeta(p.Admin, p.Cuenta, '_Planes');
  const reg = await B.guardarPrueba(file, p.Carpeta, p.Admin, periodo, null, p.Id);
  B.d.Movimientos.push({
    Id: B.uuid(), Fecha: B.aIso(B.hoy()), Tipo: 'Gasto', Descripcion: `Plan familiar · ${p.Admin}`,
    Monto: p.Monto, Moneda: p.Moneda, Tasa: B.d.Tasa, ClienteId: null, Prueba: reg.Archivo,
  });
  p.UltimoPago = B.aIso(B.hoy());
  p.ProximoPago = B.aIso(nuevo);
  await B.guardar();
  return reg;
};

/* ───────────── Movimientos ───────────── */
B.guardarMovimiento = async f => {
  const monto = B.tryNum(f.Monto);
  if (!(monto > 0)) return 'Escribe un monto válido (mayor que cero).';
  if (!(B.d.Tasa > 0)) return 'Primero define o actualiza la tasa BCV (arriba) para poder calcular los equivalentes.';
  const fecha = B.deIso(f.Fecha) || B.hoy();
  B.d.Movimientos.push({
    Id: B.uuid(), Fecha: B.aIso(fecha), Tipo: f.Tipo === 'Gasto' ? 'Gasto' : 'Ingreso',
    Descripcion: f.Descripcion.trim() || (f.Tipo === 'Gasto' ? 'Gasto' : 'Ingreso'),
    Monto: monto, Moneda: f.Moneda === 'VES' ? 'VES' : 'USD', Tasa: B.d.Tasa, ClienteId: null, Prueba: null,
  });
  await B.guardar();
  return null;
};

/* Elimina un movimiento; si era el pago de un cliente ofrece devolver su fecha de pago. */
B.eliminarMovimiento = async m => {
  if (!await B.confirmar('Eliminar movimiento',
    `¿Eliminar este movimiento?\n\n${B.fechaCorta(m.Fecha)} · ${m.Descripcion} · ${B.montoMov(m)}`, { si: 'Eliminar', peligro: true })) return false;
  B.d.Movimientos = B.d.Movimientos.filter(x => x.Id !== m.Id);
  const c = m.ClienteId ? B.cliente(m.ClienteId) : null;
  const ci = Number.isInteger(m.CuentaIndice) ? m.CuentaIndice : null;
  if (c && B.porCuenta(c) && ci !== null && ci < c.Cuentas) {
    const antes = B.aIso(B.addMeses(B.deIso(B.cFecha(c, ci)), -1));
    if (await B.confirmar('Revertir pago',
      `Este movimiento era un pago de ${c.Nombre} (${B.nombreCuenta(c, ci)}).\n¿Devolver la fecha de esa cuenta al ${B.fechaCorta(antes)}?`, { si: 'Sí, devolver', no: 'No' })) {
      c.ProximosPagos[ci] = antes; c.UltimosPagos[ci] = null; B.sincronizar(c);
    }
  } else if (c && await B.confirmar('Revertir pago',
    `Este movimiento era un pago de ${c.Nombre}.\n¿Devolver su próximo pago al ${B.fechaCorta(B.aIso(B.addMeses(B.deIso(c.ProximoPago), -1)))}?`, { si: 'Sí, devolver', no: 'No' })) {
    c.ProximoPago = B.aIso(B.addMeses(B.deIso(c.ProximoPago), -1));
    c.UltimoPago = null;
    c.ProximosPagos = Array(c.Cuentas).fill(c.ProximoPago);
  }
  await B.guardar();
  return true;
};

B.montoMov = m => (m.Tipo === 'Ingreso' ? '+ ' : '− ') + B.dinero(m.Monto, m.Moneda);
B.equivMov = m => m.Moneda === 'USD' ? B.ves(B.mVes(m)) : B.usd(B.mUsd(m));

B.resumenMes = fecha => {
  const a = fecha.getFullYear(), mes = fecha.getMonth();
  const ms = B.d.Movimientos.filter(m => { const d = B.deIso(m.Fecha); return d && d.getFullYear() === a && d.getMonth() === mes; });
  const suma = (t, f) => ms.filter(m => m.Tipo === t).reduce((s, m) => s + f(m), 0);
  const iU = suma('Ingreso', B.mUsd), iV = suma('Ingreso', B.mVes), gU = suma('Gasto', B.mUsd), gV = suma('Gasto', B.mVes);
  const fin = new Date(a, mes + 1, 0), esActual = a === B.hoy().getFullYear() && mes === B.hoy().getMonth();
  const vence = f => { const d = B.deIso(f); return !!d && (esActual ? d <= fin : (d.getFullYear() === a && d.getMonth() === mes)); };
  // (cliente, cuántas cuentas por cobrar): una sola cuenta por cliente, o cada cuenta con su fecha
  const porCobrar = B.d.Clientes.map(c => ({ c, n: B.porCuenta(c) ? c.ProximosPagos.slice(0, c.Cuentas).filter(vence).length : (vence(c.ProximoPago) ? 1 : 0) }))
    .filter(x => x.n > 0);
  return {
    iU, iV, gU, gV, bU: iU - gU, bV: iV - gV, n: ms.length,
    cU: porCobrar.reduce((s, x) => s + B.aUsd(x.c.Monto * x.n, x.c.Moneda), 0),
    cV: porCobrar.reduce((s, x) => s + B.aVes(x.c.Monto * x.n, x.c.Moneda), 0),
  };
};

/* ───────────── Tasa BCV ───────────── */
B.actualizarTasa = async (silencioso = false) => {
  try {
    const r = await fetch('https://ve.dolarapi.com/v1/dolares/oficial', { cache: 'no-store' });
    const j = await r.json();
    const v = Number(j.promedio);
    if (!(v > 0)) throw new Error('sin tasa');
    B.d.Tasa = v; B.d.TasaActualizada = B.ahoraIso();
    await B.guardar();
    B.render();
    if (!silencioso) B.toast('Tasa actualizada', `Bs ${B.tasaTxt(v)} por US$ · DolarApi (tasa oficial BCV)`);
    return true;
  } catch {
    if (!silencioso) B.aviso('No pude consultar la tasa en internet. Revisa tu conexión o escríbela a mano tocando el recuadro de la tasa.');
    return false;
  }
};

B.mensajeTasa = () => !(B.d.Tasa > 0) ? 'Sin tasa: toca para definirla'
  : B.d.TasaActualizada ? 'Actualizada ' + B.horaTexto(B.d.TasaActualizada) : 'Definida a mano';

/* ───────────── Avisos de pago ───────────── */
B.pendientes = () => {
  const r = { hoy: [], debe: [], cerca: [] };
  const poner = (e, t) => (e === 'Hoy' ? r.hoy : e === 'Debe' ? r.debe : e === 'Cerca' ? r.cerca : null)?.push(t);
  for (const c of B.d.Clientes) {
    if (B.porCuenta(c)) for (let i = 0; i < c.Cuentas; i++) poner(B.cEstadoC(c, i), `${c.Nombre} (${B.nombreCuenta(c, i)})`);
    else poner(B.cEstado(c), c.Nombre);
  }
  for (const p of B.d.Planes) poner(B.estadoDe(B.dias(p.ProximoPago)), 'Plan de ' + p.Admin);
  return r;
};

B.textoPendientes = r => {
  const t = [];
  if (r.debe.length) t.push(`${r.debe.length} atrasado(s): ${r.debe.slice(0, 3).join(', ')}${r.debe.length > 3 ? '…' : ''}`);
  if (r.hoy.length) t.push(`Vencen hoy: ${r.hoy.slice(0, 3).join(', ')}${r.hoy.length > 3 ? '…' : ''}`);
  if (r.cerca.length) t.push(`${r.cerca.length} por vencer`);
  return t.join(' · ');
};

B.notificar = async (titulo, cuerpo) => {
  try {
