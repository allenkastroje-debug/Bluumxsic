/* manual = botón "Revisar ahora". Automático: una vez al día pasada la hora elegida. */
B.revisarPagos = async (manual = false) => {
  const r = B.pendientes(), texto = B.textoPendientes(r), hay = r.debe.length + r.hoy.length + r.cerca.length > 0;
  if (manual) {
    if (!hay) { B.toast('Todo al día', 'No hay pagos vencidos, para hoy ni por vencer.', 'Exito'); return; }
    B.toast('Pagos pendientes', texto, 'Aviso');
    await B.notificar('SP-Control · pagos', texto);
    return;
  }
  if (!B.d.AvisosActivos || !hay) return;
  const ahora = new Date(), hoyIso = B.aIso(B.hoy());
  if (ahora.getHours() < B.d.AvisoHora || B.d.UltimoAviso === hoyIso) return;
  B.d.UltimoAviso = hoyIso;
  await B.guardar();
  B.toast('Pagos pendientes', texto, 'Aviso');
  await B.notificar('SP-Control · pagos', texto);
};

/* ───────────── Respaldo (.zip) ───────────── */
const aBase64 = blob => new Promise((ok, mal) => {
  const fr = new FileReader();
  fr.onload = () => ok(String(fr.result).split(',')[1] || '');
  fr.onerror = () => mal(fr.error);
  fr.readAsDataURL(blob);
});
const deBase64 = (b64, tipo) => {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: tipo });
};
B.mimeDe = ruta => ({ '.png': 'image/png', '.webp': 'image/webp', '.gif': 'image/gif', '.bmp': 'image/bmp' }[(/\.[a-z0-9]+$/i.exec(ruta) || [''])[0].toLowerCase()] || 'image/jpeg');

/* Mismo formato que el respaldo de la app de Windows (v2.2): se pueden pasar datos y comprobantes en ambos sentidos. */
B.crearRespaldo = async () => {
  const claves = await B.db.keys('pruebas'), entradas = [];
  for (const k of claves) {
    const blob = await B.db.get('pruebas', k);
    if (blob) entradas.push({ nombre: 'comprobantes/' + String(k), datos: blob });
  }
  const d = B.d;
  const datos = {
    Clientes: d.Clientes, Movimientos: d.Movimientos, Planes: d.Planes, Pruebas: d.Pruebas,
    Tasa: d.Tasa, TasaActualizada: d.TasaActualizada, AutoActualizar: d.AutoActualizar,
    AvisosActivos: d.AvisosActivos, AvisoHora: d.AvisoHora, DiasCerca: d.DiasCerca, UltimoAviso: d.UltimoAviso,
  };
  const json = JSON.stringify({ Version: 2, App: 'SP-Control', Fecha: B.ahoraIso(), Datos: datos, Archivos: [] }, null, 1);
  entradas.push({ nombre: 'datos.json', datos: json });
  const n = new Date();
  const nombre = `SP-Control-respaldo-${n.getFullYear()}${B.pad(n.getMonth() + 1)}${B.pad(n.getDate())}-${B.pad(n.getHours())}${B.pad(n.getMinutes())}.zip`;
  return { blob: await B.zip.crear(entradas), nombre, n: claves.length };
};

B.descargar = (blob, nombre) => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};

B.leerArchivoTexto = async file => {
  const intentos = [() => file.text(), () => new Response(file).text(),
    () => new Promise((ok, mal) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => mal(fr.error); fr.readAsText(file); })];
  let ult;
  for (const f of intentos) { try { return await f(); } catch (e) { ult = e; } }
  throw new Error('No se pudo leer el archivo desde el teléfono (' + (ult?.name || 'error') + '). Cópialo a la carpeta Descargas y vuelve a elegirlo desde ahí.');
};

const validarRespaldo = r => {
  if (!r || typeof r !== 'object' || !r.Datos || !(r.Version >= 1)) throw new Error('Este archivo no es un respaldo de SP-Control.');
};

/* Acepta el .zip nuevo (datos.json + comprobantes/) y el .json antiguo (fotos en Base64).
   Devuelve { Version, Fecha, Datos, Archivos: [{ Ruta, obtener(): Promise<Blob> }] } */
B.leerRespaldo = async file => {
  if (!file.size) throw new Error('El archivo está vacío (0 KB). Vuelve a copiarlo; puede que la extracción quedara incompleta.');
  const cab = await B.zip.bytes(file.slice(0, 4));
  if (B.cripto.esCifrado(cab)) {   // respaldo con contraseña: se pide y se abre en memoria
    const todo = await B.zip.bytes(file);
    let abierto = null;
    const clave = await B.pedirClave({
      titulo: 'Respaldo protegido', intro: 'Este respaldo tiene contraseña. Escríbela para abrirlo.',
      validar: async c => { try { abierto = await B.cripto.descifrar(todo, c); return true; } catch (e) { return e.clave ? e.message : (e.message || 'No se pudo abrir.'); } },
    });
    if (clave === null) { const e = new Error('cancelado'); e.cancelado = true; throw e; }
    file = new Blob([abierto], { type: 'application/zip' });
    return B.leerRespaldo(file);
  }
  if (cab[0] === 0x50 && cab[1] === 0x4B) {
    const lista = await B.zip.leer(file);
    const ed = lista.find(x => x.nombre.toLowerCase() === 'datos.json');
    if (!ed) throw new Error('El .zip no trae «datos.json»: no es un respaldo de SP-Control.');
    let r;
    try { r = JSON.parse((await (await ed.leer()).text()).replace(/^\uFEFF/, '')); } catch (e) { if (e.message && /contraseña|zip|navegador|compresión/.test(e.message)) throw e; throw new Error('«datos.json» está dañado o incompleto.'); }
    validarRespaldo(r);
    r.Archivos = lista.filter(x => /^comprobantes\//i.test(x.nombre))
      .map(x => ({ Ruta: x.nombre.replace(/^comprobantes\//i, ''), obtener: x.leer }));
    return r;
  }
  let txt = await B.leerArchivoTexto(file);
  txt = txt.replace(/^\uFEFF/, '').trim();
  let r;
  try { r = JSON.parse(txt); } catch (e) {
    throw new Error('El archivo no es un respaldo completo (' + Math.round(file.size / 1024) + ' KB leídos). Puede estar cortado o dañado: ' + (e.message || e));
  }
  validarRespaldo(r);
  r.Archivos = (Array.isArray(r.Archivos) ? r.Archivos : []).map(a => ({ Ruta: a.Ruta, obtener: async () => deBase64(a.Base64 || '', B.mimeDe(String(a.Ruta || ''))) }));
  return r;
};

B.restaurar = async r => {
  await B.db.set('kv', 'datos_antes', B.d);                // copia de seguridad previa
  await B.db.clear('pruebas');
  let n = 0;
  for (const a of r.Archivos) {
    const ruta = String(a.Ruta || '').replace(/\\/g, '/');
    const ext = (/\.[a-z0-9]+$/i.exec(ruta) || [''])[0].toLowerCase();
    if (!ruta || ruta.startsWith('/') || ruta.split('/').some(s => s === '..' || s === '') || !B.EXT_OK.includes(ext)) continue;
    try {
      const blob = await a.obtener();
      if (!blob || !blob.size) continue;
      await B.db.set('pruebas', ruta, blob.type ? blob : new Blob([blob], { type: B.mimeDe(ruta) })); n++;
    } catch { /* imagen dañada: se omite */ }
  }
  const nuevo = B.normalizar(r.Datos);
  // se conservan los ajustes propios de este teléfono (avisos, días de anticipación)
  nuevo.AvisosActivos = B.d.AvisosActivos; nuevo.AvisoHora = B.d.AvisoHora; nuevo.DiasCerca = B.d.DiasCerca;
  nuevo.AutoActualizar = B.d.AutoActualizar; nuevo.UltimoAviso = B.d.UltimoAviso;
  if (!(nuevo.Tasa > 0)) nuevo.Tasa = B.d.Tasa;
  B.d = nuevo;
  await B.guardar();
  return n;
};

/* Borra una foto de comprobante: del teléfono, de la lista y de los movimientos que la usaban. */
B.eliminarPrueba = async ruta => {
  const usos = B.d.Movimientos.filter(m => m.Prueba === ruta).length;
  if (!await B.confirmar('Eliminar comprobante',
    `¿Eliminar la foto «${B.nombreArchivo(ruta)}»?\n\n${usos ? 'El movimiento que la usa se queda, solo sin foto.\n' : ''}Esto no se puede deshacer.`, { si: 'Eliminar', peligro: true })) return false;
  await B.db.del('pruebas', ruta);
  B.d.Pruebas = B.d.Pruebas.filter(r => r.Archivo !== ruta);
  for (const m of B.d.Movimientos) if (m.Prueba === ruta) m.Prueba = null;
  const u = B._urls.get(ruta); if (u) { try { URL.revokeObjectURL(u); } catch { } B._urls.delete(ruta); }
  await B.guardar();
  return true;
};

/* Imagen guardada → URL para mostrarla (se cachean mientras la app está abierta). */
B._urls = new Map();
B.urlPrueba = async ruta => {
  if (B._urls.has(ruta)) return B._urls.get(ruta);
  const blob = await B.db.get('pruebas', ruta);
  if (!blob) return null;
  const u = URL.createObjectURL(blob);
  B._urls.set(ruta, u);
  return u;
};

B.whatsapp = c => {
  let t = (c.Telefono || '').replace(/[^\d+]/g, '');
  if (!t) return null;
  t = t.replace(/^\+/, '');
  if (t.startsWith('00')) t = t.slice(2);
  else if (t.startsWith('0')) t = '58' + t.slice(1);
  const iu = B.porCuenta(c) ? B.iUrgente(c) : null;
  const dias = iu === null ? B.cDias(c) : B.cDiasC(c, iu);
  const cuando = dias < 0 ? `venció hace ${-dias} día(s)` : dias === 0 ? 'vence hoy' : `vence el ${B.fechaCorta(iu === null ? c.ProximoPago : B.cFecha(c, iu))}`;
  const de = iu === null ? 'tu pago de Spotify' : `el pago de tu cuenta ${B.nombreCuenta(c, iu)} de Spotify`;
  const msg = `Hola ${c.Nombre}, te escribo para recordarte que ${de} (${B.dinero(c.Monto, c.Moneda)}) ${cuando}. ¡Gracias!`;
  return `https://wa.me/${t}?text=${encodeURIComponent(msg)}`;
};

</script>
<script>
/* Pantallas de la app: cabecera, pestañas, Resumen, Clientes, Planes, Movimientos y Más (ajustes). */
'use strict';

const hoy0 = B.hoy();
B.ui = {
  pag: 'resumen',
  mes: new Date(hoy0.getFullYear(), hoy0.getMonth(), 1),
  filtro: 'todos', busca: '',
  abiertos: new Set(), planesAb: new Set(), secs: new Set(['apariencia']),
  movModo: 'dia', movDia: hoy0, calMes: new Date(hoy0.getFullYear(), hoy0.getMonth(), 1), calAbierto: true,
  instalar: null,
};

const e = B.esc;
const chipEstado = (est, txt) => `<span class="chip" style="--st:${B.ESTADO_COLOR[est]}">${e(txt)}</span>`;

/* ───────────── Cabecera y pestañas ───────────── */
B.renderCabecera = () => {
  const a = B.aj;
  $('#cabecera').innerHTML = `
    <div class="marca">
      ${a.logo ? '<span class="logo" aria-hidden="true"></span>' : ''}
      <div class="marca-txt"><b>${e(a.nombre)}</b>${a.sub ? `<small>${e(a.sub)}</small>` : ''}</div>
    </div>
    ${a.mostrarTasa ? `<button class="tasa ${B.d.Tasa > 0 ? '' : 'falta'}" data-act="tasa" aria-label="Tasa BCV">
      <small>Tasa BCV</small><b>${B.d.Tasa > 0 ? 'Bs ' + B.tasaTxt(B.d.Tasa) : 'Definir'}</b></button>` : ''}`;
  document.title = a.sub ? `${a.nombre} · ${a.sub}` : a.nombre;
};

const TABS = [['resumen', '📊', 'Resumen'], ['clientes', '👥', 'Clientes'], ['planes', '🏠', 'Planes'], ['movs', '💸', 'Movimientos'], ['mas', '⚙', 'Más']];
B.renderTabs = () => {
  const r = B.pendientes(), n = r.debe.length + r.hoy.length;
  $('#tabs').innerHTML = TABS.map(([k, ic, tx]) => `
    <button class="tab ${B.ui.pag === k ? 'act' : ''}" data-act="ir" data-p="${k}" ${B.ui.pag === k ? 'aria-current="page"' : ''}>
      <span class="tab-ic">${ic}${k === 'clientes' && n ? `<i class="punto-n">${n}</i>` : ''}</span><span>${tx}</span>
    </button>`).join('');
};

function $(s, r = document) { return r.querySelector(s); }

B.render = () => {
  const y = window.scrollY;
  B.renderCabecera();
  B.renderTabs();
  const v = $('#vista');
  const vistas = { resumen: vResumen, clientes: vClientes, planes: vPlanes, movs: vMovs, mas: vMas };
  v.innerHTML = (vistas[B.ui.pag] || vResumen)() + fab();
  window.scrollTo(0, y);
  if (B.ui.pag === 'mas') B.pintarMas();
};

B.irA = p => {
  B.ui.pag = p;
  const v = $('#vista');
  B.render();
  v.classList.remove('entra'); void v.offsetWidth; v.classList.add('entra');
  window.scrollTo(0, 0);
};

function fab() {
  const a = { clientes: ['nuevo-cli', 'Nuevo cliente'], planes: ['nuevo-plan', 'Nuevo plan'], movs: ['nuevo-mov', 'Nuevo movimiento'] }[B.ui.pag];
  return a ? `<button class="fab" data-act="${a[0]}" aria-label="${a[1]}"><span>＋</span></button>` : '';
}

const vacio = (ic, t, s) => `<div class="vacio"><span>${ic}</span><b>${e(t)}</b><small>${e(s)}</small></div>`;

/* ───────────── Resumen ───────────── */
function vResumen() {
  const r = B.resumenMes(B.ui.mes), p = B.pendientes();
  const hay = p.debe.length + p.hoy.length + p.cerca.length > 0;
  const prox = B.cobrosProximos(7).slice(0, 8);
  const planes = B.d.Planes.filter(x => B.dias(x.ProximoPago) <= 7).sort((a, b) => a.ProximoPago.localeCompare(b.ProximoPago));
  const porCobrar = B.d.Clientes.filter(c => B.cDias(c) <= 0).length;   // clientes con algún pago vencido o de hoy
  return `<section class="pagina">
    <div class="mes-nav">
      <button class="icono" data-act="mes-ant" aria-label="Mes anterior">‹</button>
      <h1>${e(B.mesAnio(B.ui.mes))}</h1>
      <button class="icono" data-act="mes-sig" aria-label="Mes siguiente">›</button>
    </div>
    ${hay ? `<div class="card alerta" style="--st:${p.debe.length ? 'var(--danger)' : p.hoy.length ? 'var(--hoy)' : 'var(--warn)'}">
      <b>${p.debe.length ? '✖ Hay pagos atrasados' : p.hoy.length ? '● Hoy vencen pagos' : '◔ Pagos por vencer'}</b>
      <small>${e(B.textoPendientes(p))}</small></div>` : ''}
    <div class="stats">
      ${stat('Ganado', r.iU, r.iV, 'ing')}
      ${stat('Gastos', r.gU, r.gV, 'gas')}
      ${stat('Balance', r.bU, r.bV, r.bU >= 0 ? 'ing' : 'gas')}
      ${stat('Por cobrar', r.cU, r.cV, 'cob')}
    </div>
    <div class="fila-chips">
      <span class="chip" style="--st:var(--danger)">${porCobrar} por cobrar</span>
      <span class="chip" style="--st:var(--ok)">${B.d.Clientes.length - porCobrar} al día</span>
      <span class="chip" style="--st:var(--accent)">${r.n} movimiento(s)</span>
    </div>
    <h2 class="sec-t">Próximos cobros</h2>
    ${prox.length ? prox.map(({ c, i }) => {
      const est = i === null ? B.cEstado(c) : B.cEstadoC(c, i), dias = i === null ? B.cDias(c) : B.cDiasC(c, i);
      return `
      <div class="card fila st-${est}">
        <div class="fila-info"><b>${e(c.Nombre)}${i === null ? '' : ' · ' + e(B.nombreCuenta(c, i))}</b><small>${e(B.dinero(c.Monto, c.Moneda))} · ${e(B.diasTexto(dias))}</small></div>
        ${chipEstado(est, i === null ? B.cEstadoTexto(c) : B.estadoTextoDe(est, !!c.UltimosPagos[i]))}
        <button class="btn mini" data-act="pagar-cli" data-id="${c.Id}"${i === null ? '' : ` data-i="${i}"`}>✔ Pagó</button>
      </div>`; }).join('') : vacio('🎉', 'Nada por cobrar esta semana', 'Cuando alguien venza en los próximos 7 días aparecerá aquí.')}
    ${planes.length ? `<h2 class="sec-t">Planes por pagar</h2>` + planes.map(x => `
      <div class="card fila st-${B.estadoDe(B.dias(x.ProximoPago))}">
        <div class="fila-info"><b>${e(x.Admin)}</b><small>${e(B.dinero(x.Monto, x.Moneda))} · ${e(B.diasTexto(B.dias(x.ProximoPago)))}</small></div>
        ${chipEstado(B.estadoDe(B.dias(x.ProximoPago)), B.pEstadoTexto(x))}
        <button class="btn mini" data-act="pagar-plan" data-id="${x.Id}">✔ Pagar</button>
      </div>`).join('') : ''}
  </section>`;
}
function stat(t, usd, ves, k) {
  return `<div class="card stat ${k}"><small>${t}</small><b>${B.usd(usd)}</b><span>${B.ves(ves)}</span></div>`;
}

/* ───────────── Clientes ───────────── */
function vClientes() {
  const q = B.ui.busca.trim().toLowerCase();
  const todos = B.d.Clientes, deben = todos.filter(c => B.cDias(c) <= 0);
  let lista = B.ui.filtro === 'cobrar' ? deben : B.ui.filtro === 'dia' ? todos.filter(c => B.cDias(c) > 0) : todos;
  if (q) lista = lista.filter(c => (c.Nombre + ' ' + B.usuariosTexto(c) + ' ' + c.Telefono).toLowerCase().includes(q));
  lista = [...lista].sort((a, b) => a.ProximoPago.localeCompare(b.ProximoPago) || a.Nombre.localeCompare(b.Nombre));
  const f = (k, t, n) => `<button class="chipbtn ${B.ui.filtro === k ? 'act' : ''}" data-act="filtro" data-f="${k}">${t} <i>${n}</i></button>`;
  return `<section class="pagina">
    <h1 class="tit">Clientes</h1>
    <div class="buscar"><span>🔍</span><input type="search" id="buscar" placeholder="Buscar cliente…" value="${e(B.ui.busca)}" autocomplete="off"></div>
    <div class="fila-chips">${f('todos', 'Todos', todos.length)}${f('cobrar', 'Por cobrar', deben.length)}${f('dia', 'Al día', todos.length - deben.length)}</div>
    <div class="lista">${lista.length ? lista.map(tarjetaCliente).join('') : vacio('👥', todos.length ? 'Sin resultados' : 'Aún no hay clientes', todos.length ? 'Prueba con otra búsqueda o filtro.' : 'Toca ＋ para registrar al primero.')}</div>
  </section>`;
}

function tarjetaCliente(c) {
  const est = B.cEstado(c), ab = B.ui.abiertos.has(c.Id), dias = B.cDias(c);
  const por = B.porCuenta(c);
  const cuentas = Array.from({ length: c.Cuentas }, (_, i) => {
    const p = B.planDeCuenta(c, i);
    if (!por) return `<li><span>${e(B.nombreCuenta(c, i))}</span><small>${p ? '🏠 ' + e(p.Admin) : 'Sin plan'}</small></li>`;
    const ce = B.cEstadoC(c, i);
    return `<li class="cta st-${ce}">
      <div class="cta-info"><span>${e(B.nombreCuenta(c, i))}</span>
        <small>${chipEstado(ce, B.estadoTextoDe(ce, !!c.UltimosPagos[i]))} ${e(B.fechaCorta(B.cFecha(c, i)))} · ${e(B.diasTexto(B.cDiasC(c, i)))}${p ? ' · 🏠 ' + e(p.Admin) : ''}</small></div>
      <button class="btn mini" data-act="pagar-cli" data-id="${c.Id}" data-i="${i}">✔ Pagó</button></li>`;
  }).join('');
  const wa = B.whatsapp(c);
  return `<article class="card cli st-${est} ${ab ? 'abierto' : ''}" data-id="${c.Id}">
    <button class="cli-cab" data-act="abrir-cli" data-id="${c.Id}" aria-expanded="${ab}">
      <div class="cli-info"><b>${e(c.Nombre)}</b><small>${e(B.cSub(c)) || '—'}</small></div>
      <div class="cli-der"><b>${e(B.dinero(c.Monto, c.Moneda))}${por ? ' <small>c/u</small>' : ''}</b>${chipEstado(est, B.cEstadoTexto(c))}</div>
    </button>
    <div class="cli-pie"><span>${por ? 'Próximo (más cercano)' : 'Próximo pago'}: ${e(B.fechaCorta(c.ProximoPago))}</span><span>${e(B.diasTexto(dias))}</span></div>
    <div class="detalle"><div class="det-in">
      <dl class="datos">
        <div><dt>Último pago</dt><dd>${e(B.fechaCorta(c.UltimoPago))}</dd></div>
        <div><dt>Teléfono</dt><dd>${e(c.Telefono || '—')}</dd></div>
        ${c.Notas ? `<div class="ancho"><dt>Notas</dt><dd>${e(c.Notas)}</dd></div>` : ''}
      </dl>
      <h3>${por ? 'Cuentas y fechas de pago' : 'Cuentas que alquila'}</h3>
      <ul class="cuentas">${cuentas}</ul>
      <div class="acciones">
        ${por ? '' : `<button class="btn" data-act="pagar-cli" data-id="${c.Id}">✔ Pagó</button>`}
        ${wa ? `<a class="btn fantasma" href="${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}
        ${c.Telefono ? `<a class="btn fantasma" href="tel:${e(c.Telefono.replace(/[^\d+]/g, ''))}">📞 Llamar</a>` : ''}
        <button class="btn fantasma" data-act="comprobantes" data-t="${e(c.Carpeta || '')}" data-n="${e(c.Nombre)}">🧾 Comprobantes</button>
        <button class="btn fantasma" data-act="edit-cli" data-id="${c.Id}">✎ Editar</button>
        <button class="btn fantasma peligro-t" data-act="del-cli" data-id="${c.Id}">Eliminar</button>
      </div>
    </div></div>
  </article>`;
}

/* ───────────── Planes familiares ───────────── */
function vPlanes() {
  return `<section class="pagina">
    <h1 class="tit">Planes familiares</h1>
    <p class="sub">Administrador + 5 cuentas = 6 lugares por plan.</p>
    <div class="lista">${B.d.Planes.length ? B.d.Planes.map(tarjetaPlan).join('') : vacio('🏠', 'Aún no hay planes', 'Toca ＋ para registrar el primer plan familiar.')}</div>
  </section>`;
}

function tarjetaPlan(p) {
  const est = B.estadoDe(B.dias(p.ProximoPago)), oc = B.ocupados(p), lib = B.libres(p);
  const puntos = Array.from({ length: B.MAX_PERSONAS }, (_, i) => `<i class="pt ${i === 0 ? 'admin' : i < oc ? 'ocu' : ''}"></i>`).join('');
  const miembros = p.Asignaciones.map(a => ({ a, c: B.cliente(a.ClienteId) })).filter(x => x.c).map(({ a, c }) => `
    <li class="st-${B.cEstado(c)}">
      <div><b>${e(c.Nombre)}</b><small>${e(B.nombreCuenta(c, a.Indice))}</small></div>
      ${chipEstado(B.cEstado(c), B.cEstadoTexto(c))}
      <button class="icono chico" data-act="retirar" data-p="${p.Id}" data-c="${c.Id}" data-i="${a.Indice}" aria-label="Retirar del plan">✕</button>
    </li>`).join('');
  return `<article class="card plan st-${est}">
    <div class="plan-cab">
      <div><b>${e(p.Admin)}</b><small>${e(p.Cuenta || 'Sin cuenta indicada')}</small></div>
      ${chipEstado(est, B.pEstadoTexto(p))}
    </div>
    <div class="cupos"><span class="puntos">${puntos}</span>
      <small>${oc} de ${B.MAX_PERSONAS} ocupados · ${lib === 0 ? 'Plan lleno' : lib === 1 ? '1 cupo libre' : lib + ' cupos libres'}</small></div>
    <p class="pago">Se paga <b>${e(B.dinero(p.Monto, p.Moneda))}</b> · ${e(B.fechaCorta(p.ProximoPago))} · ${e(B.diasTexto(B.dias(p.ProximoPago)))}</p>
    <ul class="miembros">${miembros || '<li class="vacia"><small>Sin cuentas de clientes asignadas todavía.</small></li>'}</ul>
    <div class="acciones">
      <button class="btn" data-act="add-miembro" data-id="${p.Id}" ${lib === 0 ? 'disabled' : ''}>＋ Agregar cuenta</button>
      <button class="btn fantasma" data-act="pagar-plan" data-id="${p.Id}">✔ Pagar plan</button>
      <button class="btn fantasma" data-act="comprobantes" data-t="${e(p.Carpeta || '')}" data-n="${e(p.Admin)}">🧾 Comprobantes</button>
      <button class="btn fantasma" data-act="edit-plan" data-id="${p.Id}">✎ Editar</button>
      <button class="btn fantasma peligro-t" data-act="del-plan" data-id="${p.Id}">Eliminar</button>
    </div>
  </article>`;
}

/* ───────────── Movimientos + calendario ───────────── */
B.calendario = () => {
  const m = B.ui.calMes, y = m.getFullYear(), mes = m.getMonth(), sel = B.ui.movDia;
  const marcas = {};
  const marca = (iso, k) => { const d = B.deIso(iso); if (d && d.getFullYear() === y && Math.abs(d.getMonth() - mes) <= 1) (marcas[B.aInput(d)] ||= {})[k] = 1; };
  B.d.Movimientos.forEach(x => marca(x.Fecha, x.Tipo === 'Ingreso' ? 'i' : 'g'));
  B.d.Clientes.forEach(c => (B.porCuenta(c) ? c.ProximosPagos.slice(0, c.Cuentas) : [c.ProximoPago]).forEach(f => marca(f, 'v')));
  B.d.Planes.forEach(p => marca(p.ProximoPago, 'v'));
  const primer = new Date(y, mes, 1), desfase = (primer.getDay() + 6) % 7, inicio = new Date(y, mes, 1 - desfase);
  let celdas = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i), k = B.aInput(d), mk = marcas[k] || {};
    celdas += `<button class="dia ${d.getMonth() !== mes ? 'fuera' : ''} ${B.mismoDia(d, B.hoy()) ? 'hoy' : ''} ${B.mismoDia(d, sel) ? 'sel' : ''}" data-act="cal-dia" data-f="${k}">
      <span>${d.getDate()}</span><i>${mk.i ? '<b class="p-i"></b>' : ''}${mk.g ? '<b class="p-g"></b>' : ''}${mk.v ? '<b class="p-v"></b>' : ''}</i></button>`;
  }
  return `<div class="card cal">
    <div class="mes-nav chico">
      <button class="icono" data-act="cal-ant" aria-label="Mes anterior">‹</button>
      <h2>${e(B.mesAnio(m))}</h2>
      <button class="icono" data-act="cal-sig" aria-label="Mes siguiente">›</button>
    </div>
    <div class="sem">${B.DIAS_CORTOS.map(d => `<span>${d}</span>`).join('')}</div>
    <div class="dias">${celdas}</div>
    <div class="leyenda"><span><b class="p-i"></b> Ingreso</span><span><b class="p-g"></b> Gasto</span><span><b class="p-v"></b> Cobro</span></div>
  </div>`;
};

function vMovs() {
  const u = B.ui, dia = u.movModo === 'dia';
  const lista = B.d.Movimientos.filter(m => {
    const d = B.deIso(m.Fecha); if (!d) return false;
    return dia ? B.mismoDia(d, u.movDia) : (d.getFullYear() === u.calMes.getFullYear() && d.getMonth() === u.calMes.getMonth());
  }).sort((a, b) => b.Fecha.localeCompare(a.Fecha));
  const ing = lista.filter(m => m.Tipo === 'Ingreso').reduce((s, m) => s + B.mUsd(m), 0);
  const gas = lista.filter(m => m.Tipo === 'Gasto').reduce((s, m) => s + B.mUsd(m), 0);
  const cobrosCli = [];
  if (dia) for (const c of B.d.Clientes) {
    if (B.porCuenta(c)) { for (let i = 0; i < c.Cuentas; i++) if (B.mismoDia(B.deIso(B.cFecha(c, i)), u.movDia)) cobrosCli.push({ n: `${c.Nombre} · ${B.nombreCuenta(c, i)}`, c, est: B.cEstadoC(c, i) }); }
    else if (B.mismoDia(B.deIso(c.ProximoPago), u.movDia)) cobrosCli.push({ n: c.Nombre, c, est: B.cEstado(c) });
  }
  const cobros = dia ? [...cobrosCli,
    ...B.d.Planes.filter(p => B.mismoDia(B.deIso(p.ProximoPago), u.movDia)).map(p => ({ n: 'Plan de ' + p.Admin, est: B.estadoDe(B.dias(p.ProximoPago)) }))] : [];
  return `<section class="pagina">
    <h1 class="tit">Movimientos</h1>
    <div class="fila-chips">
      <button class="chipbtn ${dia ? 'act' : ''}" data-act="mov-modo" data-m="dia">Día</button>
      <button class="chipbtn ${!dia ? 'act' : ''}" data-act="mov-modo" data-m="mes">Mes completo</button>
      <button class="chipbtn ${u.calAbierto ? 'act' : ''}" data-act="cal-toggle">📅 Calendario</button>
    </div>
    ${u.calAbierto ? B.calendario() : ''}
    <h2 class="sec-t">${dia ? e(B.diaLargo(u.movDia)) : e(B.mesAnio(u.calMes))}</h2>
    <div class="fila-chips">
      <span class="chip" style="--st:var(--ok)">Ganado ${e(B.usd(ing))}</span>
      <span class="chip" style="--st:var(--danger)">Gastos ${e(B.usd(gas))}</span>
    </div>
    ${cobros.length ? `<div class="card cobros"><small>Cobros de este día</small>${cobros.map(x => `<span class="chip" style="--st:${B.ESTADO_COLOR[x.est]}">${e(x.n)}</span>`).join('')}</div>` : ''}
    <div class="lista">${lista.length ? lista.map(movFila).join('') : vacio('💸', 'Sin movimientos', dia ? 'Este día no tiene ingresos ni gastos.' : 'Este mes no tiene ingresos ni gastos.')}</div>
  </section>`;
}

function movFila(m) {
  const ing = m.Tipo === 'Ingreso';
  return `<div class="card mov">
    <div class="mov-top">
      <span class="mov-ic ${ing ? 'ing' : 'gas'}">${ing ? '↑' : '↓'}</span>
      <div class="mov-info"><b>${e(m.Descripcion)}</b><small>${e(B.fechaCorta(m.Fecha))} · ${e(B.equivMov(m))}</small></div>

}

const chips = (g, ops, act) => `<div class="fila-chips envolver">${ops.map(([v, t, st]) =>

const colores = (g, hexAct) => `<div class="colores">${B.ACENTOS.map(([n, h]) =>

  const perm = 'Notification' in window ? Notification.permission : 'no';
  const avisos = `
    <p class="nota">Te avisamos cuando un cliente o un plan vence hoy, está atrasado o por vencer.</p>
    ${toggle('avisos', 'Avisarme de los pagos', B.d.AvisosActivos)}
    <label class="campo en-linea"><span>Avisar a partir de las (0 a 23 h)</span><input type="number" inputmode="numeric" id="aj-hora" min="0" max="23" value="${B.d.AvisoHora}"></label>
    <label class="campo en-linea"><span>Días de anticipación (amarillo)</span><input type="number" inputmode="numeric" id="aj-dias" min="0" max="30" value="${B.d.DiasCerca}"></label>
    <div class="acciones">
      ${perm === 'granted' ? '<span class="chip" style="--st:var(--ok)">✔ Avisos del teléfono permitidos</span>'
        : perm === 'denied' ? '<span class="chip" style="--st:var(--danger)">Avisos bloqueados en el navegador</span>'
        : perm === 'no' ? '' : '<button class="btn" data-act="permiso">🔔 Permitir avisos del teléfono</button>'}
      <button class="btn fantasma" data-act="probar-aviso">Enviar aviso de prueba</button>
      <button class="btn fantasma" data-act="revisar">Revisar pagos ahora</button>

  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent), instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const instalar = instalada ? '<p class="nota">✔ La app ya está instalada en este teléfono.</p>' : `

  return `<section class="pagina">

    ${sec('letra', '🔤', 'Letra y tamaño', letra)}
    ${sec('distrib', '📐', 'Distribución', distrib)}
    ${sec('avisos', '🔔', 'Avisos de pago', avisos)}
    ${sec('msgs', '💬', 'Mensajes emergentes', msgs)}
    ${sec('resp', '💾', 'Respaldo y comprobantes', resp)}
    ${sec('inst', '📲', 'Instalar la app', instalar)}
    <p class="pie">SP-Control · Allen.Inc (Ai) (móvil) · tus datos viven solo en este teléfono.<br>
      <b>Versión ${B.VERSION}</b> · <span id="ver-estado">revisando…</span></p>
    <div class="acciones" style="justify-content:center"><button class="btn fantasma" data-act="actualizar">🔄 Buscar actualización</button></div>
  </section>`;
}

/* Compara la versión del código con la de los archivos guardados en el teléfono. */
B.estadoVersion = async () => {
  const v = $('#ver-estado');
  if (!v) return;
  try {
    const ks = ('caches' in window) ? (await caches.keys()).filter(k => k.startsWith('spcontrol-v')) : [];
    if (!ks.length) { v.textContent = 'sin copia sin conexión'; return; }
    const guardada = ks.map(k => k.replace('spcontrol-v', '')).sort().pop();
    v.textContent = guardada === B.VERSION ? '✔ al día' : `⚠ archivos guardados: ${guardada}. Cierra la app y ábrela de nuevo`;
  } catch { v.textContent = ''; }
};

B.pintarMas = async () => {
  B.estadoVersion();
  const el = $('#almacen-estado');
  if (!el) return;
  try {
    const n = (await B.db.keys('pruebas')).length;
    let txt = `${n} comprobante(s) guardado(s) en este teléfono.`;
    if (navigator.storage?.estimate) { const s = await navigator.storage.estimate(); txt += ` Usado: ${(s.usage / 1048576).toFixed(1)} MB.`; }
    if (navigator.storage?.persisted) txt += (await navigator.storage.persisted()) ? ' Almacenamiento protegido ✔' : ' Haz un respaldo de vez en cuando: el navegador podría borrar los datos si falta espacio.';
    el.textContent = txt;
  } catch { el.textContent = ''; }
};

</script>
<script>
/* Formularios, acciones de los botones y arranque de la app. */
'use strict';

/* ───────────── Formularios ───────────── */
const seg = (name, ops, val) => `<div class="seg" role="radiogroup">${ops.map(([v, t]) =>
  `<label><input type="radio" name="${name}" value="${v}" ${v === val ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div>`;
const campo = (t, inner, extra = '') => `<label class="campo ${extra}"><span>${t}</span>${inner}</label>`;

B.hojaTasa = () => {
  const h = B.sheet('Tasa BCV', `
    <p class="nota">Bolívares por cada dólar. Se usa para calcular los equivalentes de cada movimiento.</p>
    ${campo('Tasa (Bs por US$)', `<input id="t-valor" inputmode="decimal" value="${B.d.Tasa > 0 ? B.tasaTxt(B.d.Tasa) : ''}" placeholder="Ej. 36,50">`)}
    <p class="nota" id="t-msg">${e(B.mensajeTasa())}</p>
    <button class="tog ${B.d.AutoActualizar ? 'on' : ''}" role="switch" aria-checked="${B.d.AutoActualizar}" id="t-auto"><span>Actualizar sola al abrir la app y cada hora</span><i></i></button>
    <div class="acciones fin">
      <button class="btn fantasma" id="t-web">⟳ Consultar en internet</button>
      <button class="btn" id="t-ok">Guardar</button>
    </div>`);
  h.$('#t-auto').onclick = async ev => {
    B.d.AutoActualizar = !B.d.AutoActualizar;
    ev.currentTarget.classList.toggle('on', B.d.AutoActualizar);
    ev.currentTarget.setAttribute('aria-checked', B.d.AutoActualizar);
    await B.guardar();
  };
  h.$('#t-web').onclick = async ev => {
    ev.currentTarget.disabled = true;
    if (await B.actualizarTasa(false)) h.cerrar();
    else ev.currentTarget.disabled = false;
  };
  h.$('#t-ok').onclick = async () => {
    const v = B.tryNum(h.$('#t-valor').value, false);
    if (!(v > 0)) { B.aviso('Escribe una tasa válida (mayor que cero).'); return; }
    B.d.Tasa = v; B.d.TasaActualizada = null;
    await B.guardar(); h.cerrar(); B.render();
    B.toast('Tasa guardada', `Bs ${B.tasaTxt(v)} por US$`, 'Exito');
  };
};

B.hojaCliente = (c = null) => {
  const edit = !!c, hoyIso = B.aInput(B.hoy());
  const h = B.sheet(edit ? 'Editar cliente' : 'Nuevo cliente', `
    <form id="f-cli" class="form" novalidate autocomplete="off">
      ${campo('Nombre del cliente', `<input name="Nombre" value="${e(c?.Nombre || '')}" autocapitalize="words">`)}
      ${campo('Teléfono (opcional)', `<input name="Telefono" type="tel" inputmode="tel" value="${e(c?.Telefono || '')}" placeholder="0412 1234567">`)}
      ${campo('¿Cuántas cuentas alquila?', `<input name="Cuentas" type="number" inputmode="numeric" min="1" max="20" value="${c?.Cuentas || 1}">`)}
      <label class="interruptor" id="fpc-caja" hidden><input type="checkbox" name="FechasPorCuenta" ${c && B.porCuenta(c) ? 'checked' : ''}><span>Cada cuenta con su propia fecha de pago <small>(el monto es por cuenta)</small></span></label>
      <div id="usuarios"></div>
      <div class="dos">
        ${campo('<em id="monto-et" style="font-style:normal">Monto que paga</em>', `<input name="Monto" inputmode="decimal" value="${c ? B.num(c.Monto).replace(/^(.*),00$/, '$1') : ''}" placeholder="5,00">`)}
        <div class="campo"><span>Moneda</span>${seg('Moneda', [['USD', 'US$'], ['VES', 'Bs']], c?.Moneda || 'USD')}</div>
      </div>
      ${campo('Próxima fecha de pago', `<input name="ProximoPago" type="date" value="${c ? B.aInput(B.deIso(c.ProximoPago)) : hoyIso}">`)}
      ${campo('Notas (opcional)', `<textarea name="Notas" rows="2">${e(c?.Notas || '')}</textarea>`)}
      <div class="acciones fin"><button type="button" class="btn fantasma" data-cerrar>Cancelar</button><button type="submit" class="btn">${edit ? 'Guardar cambios' : 'Agregar cliente'}</button></div>
    </form>`, { alta: true });
  const form = h.$('#f-cli'), cont = h.$('#usuarios');
  const usuarios = (c ? [...c.Usuarios] : ['']);
  const fechas = c ? Array.from({ length: c.Cuentas }, (_, i) => B.aInput(B.deIso(B.cFecha(c, i)))) : [];
  const caja = h.$('#fpc-caja');
  const leerFilas = () => {
    cont.querySelectorAll('input[data-u]').forEach(i => { usuarios[+i.dataset.u] = i.value; });
    cont.querySelectorAll('input[data-f]').forEach(i => { fechas[+i.dataset.f] = i.value; });
  };
  const pintarUsuarios = () => {
    leerFilas();
    const n = Math.min(20, Math.max(1, parseInt(form.Cuentas.value, 10) || 1));
    while (usuarios.length < n) usuarios.push('');
    const base = form.ProximoPago.value || hoyIso;
    for (let i = 0; i < n; i++) if (!fechas[i]) fechas[i] = base;
    caja.hidden = n < 2;
    const por = n > 1 && form.FechasPorCuenta.checked;
    h.$('#monto-et').textContent = por ? 'Monto por cada cuenta' : 'Monto que paga';
    cont.innerHTML = Array.from({ length: n }, (_, i) =>
      campo(n === 1 ? 'Usuario de la cuenta' : `Usuario de la cuenta ${i + 1}`,
        `<input data-u="${i}" value="${e(usuarios[i] || '')}" placeholder="usuario_spotify" autocapitalize="none" spellcheck="false">`) +
      (por ? campo(`Fecha de pago de la cuenta ${i + 1}`, `<input data-f="${i}" type="date" value="${e(fechas[i])}">`) : '')).join('');
  };
  form.Cuentas.addEventListener('input', pintarUsuarios);
  form.FechasPorCuenta.addEventListener('change', pintarUsuarios);
  pintarUsuarios();
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    leerFilas();
    const f = B.leer(form);
    const err = B.validarCliente(f, usuarios, fechas);
    if (err) { B.aviso(err); return; }
    await B.guardarCliente(f, usuarios, c?.Id, fechas);
    h.cerrar(); B.render();
    B.toast(edit ? 'Cliente actualizado' : 'Cliente agregado', f.Nombre.trim(), 'Exito');
  });
};

B.hojaPlan = (p = null) => {

B.hojaMovimiento = () => {
  const h = B.sheet('Nuevo movimiento', `
    <form id="f-mov" class="form" novalidate autocomplete="off">
      ${seg('Tipo', [['Ingreso', '↑ Ingreso'], ['Gasto', '↓ Gasto / pérdida']], 'Ingreso')}

      <div class="dos">

/* Registrar un pago: la foto del comprobante es obligatoria. */
B.hojaPago = ({ titulo, intro, periodo, ejecutar, exito }) => {
  if (!(B.d.Tasa > 0)) { B.aviso('Primero define o actualiza la tasa BCV (arriba).'); return; }
  let archivo = null, url = null;
  const h = B.sheet(titulo, `
    <p class="nota">${intro}</p>
    <div class="prueba" id="pr-caja"><div class="prueba-vacia"><span>🧾</span><b>Comprobante de pago obligatorio</b><small>Toma una foto o elige la captura del pago.</small></div></div>
    <p class="nota" id="pr-nombre"></p>
    <div class="acciones">
      <label class="btn fantasma">📷 Tomar foto<input type="file" accept="image/*" capture="environment" hidden id="pr-cam"></label>
      <label class="btn fantasma">🖼 Elegir imagen<input type="file" accept="image/*" hidden id="pr-gal"></label>
    </div>
    <div class="acciones fin"><button class="btn fantasma" data-cerrar>Cancelar</button><button class="btn" id="pr-ok" disabled>✔ Registrar pago</button></div>`,
    { alCerrar: () => { if (url) URL.revokeObjectURL(url); } });
  const poner = f => {
    if (!f) return;
    if (!B.esImagen(f)) { B.aviso('El archivo debe ser una imagen (png, jpg, webp, bmp o gif).'); return; }
    archivo = f;
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(f);
    h.$('#pr-caja').innerHTML = `<img src="${url}" alt="Vista previa del comprobante">`;
    const ext = (f.size > 1.6e6 || !B.extension(f)) ? '.jpg' : B.extension(f);
    h.$('#pr-nombre').innerHTML = `Se guardará como «<b>${e(B.nombrePrueba(periodo, ext, new Set()))}</b>» en la carpeta del titular.`;
    h.$('#pr-ok').disabled = false;
  };
  h.$('#pr-cam').onchange = ev => poner(ev.target.files[0]);
  h.$('#pr-gal').onchange = ev => poner(ev.target.files[0]);
  h.$('#pr-ok').onclick = async ev => {
    if (!archivo) { B.aviso('No se registró el pago: la imagen de la prueba es obligatoria.'); return; }
    const b = ev.currentTarget; b.disabled = true; b.textContent = 'Guardando…';
    try {
      const reg = await ejecutar(archivo);
      h.cerrar(); B.render();
      B.toast(exito.titulo, `${exito.texto} · comprobante guardado como «${B.nombreArchivo(reg.Archivo)}»`, 'Exito');
    } catch (err) {
      b.disabled = false; b.textContent = '✔ Registrar pago';
      B.error('No se pudo guardar la imagen: ' + (err && err.message ? err.message : err));
    }
  };
};

/* i = cuenta concreta (cuando el cliente tiene fechas distintas por cuenta); sin i se paga la que vence primero. */
B.pagarCliente = (c, i = null) => {
  const porCuenta = B.porCuenta(c);
  if (porCuenta && (i === null || isNaN(i))) i = B.iUrgente(c);
  const periodo = B.deIso(porCuenta ? B.cFecha(c, i) : c.ProximoPago), nuevo = B.addMeses(periodo, 1);
  B.hojaPago({
    titulo: 'Registrar pago',
    intro: porCuenta
      ? `¿Registrar el pago de <b>${e(c.Nombre)}</b> · ${e(B.nombreCuenta(c, i))} por <b>${e(B.dinero(c.Monto, c.Moneda))}</b>?<br>La fecha de esa cuenta pasará del ${e(B.fechaCorta(B.aIso(periodo)))} al ${e(B.fechaCorta(B.aIso(nuevo)))}.`
      : `¿Registrar el pago de <b>${e(c.Nombre)}</b> por <b>${e(B.dinero(c.Monto, c.Moneda))}</b>?<br>Su próximo pago pasará al ${e(B.fechaCorta(B.aIso(nuevo)))}.`,
    periodo, ejecutar: f => B.registrarPagoCliente(c, f, porCuenta ? i : null),
    exito: { titulo: 'Pago registrado', texto: porCuenta ? `${c.Nombre} · ${B.nombreCuenta(c, i)}` : c.Nombre },
  });
};

B.pagarPlan = p => {
  const periodo = B.deIso(p.ProximoPago), nuevo = B.addMeses(periodo, 1);
  B.hojaPago({
    titulo: 'Pagar plan familiar',
    intro: `¿Registrar el pago del plan de <b>${e(p.Admin)}</b> por <b>${e(B.dinero(p.Monto, p.Moneda))}</b>?<br>El próximo pago pasará al ${e(B.fechaCorta(B.aIso(nuevo)))}.`,
    periodo, ejecutar: f => B.registrarPagoPlan(p, f), exito: { titulo: 'Pago del plan registrado', texto: p.Admin },
  });
};

B.hojaAgregarCuenta = p => {
  if (B.libres(p) === 0) { B.aviso('Este plan está lleno (administrador + 5 cuentas).'); return; }
  const libres = B.cuentasLibres();
  if (!libres.length) { B.aviso('No hay cuentas pendientes por asignar.\nSi un cliente alquila más cuentas, súbele el número en Clientes (✎).'); return; }
  const h = B.sheet(`Agregar al plan de ${p.Admin}`, `
    <p class="nota">Elige la cuenta del cliente que va en este plan. Quedan ${B.libres(p)} cupo(s).</p>
    <div class="lista">${libres.map(({ c, i }) => `
      <button class="card fila elegir st-${B.cEstado(c)}" data-c="${c.Id}" data-i="${i}">
        <div class="fila-info"><b>${e(c.Nombre)}</b><small>${e(B.nombreCuenta(c, i))}</small></div>${chipEstado(B.cEstado(c), B.cEstadoTexto(c))}
      </button>`).join('')}</div>`);
  h.el.addEventListener('click', async ev => {
    const b = ev.target.closest('.elegir'); if (!b) return;
    if (B.libres(p) === 0) return;
    p.Asignaciones.push({ ClienteId: b.dataset.c, Indice: +b.dataset.i });
    await B.guardar(); h.cerrar(); B.render();
    const c = B.cliente(b.dataset.c);
    B.toast('Cuenta agregada al plan', `${c.Nombre} · ${B.nombreCuenta(c, +b.dataset.i)} → ${p.Admin}`, 'Exito');
  });
};

/* Galería de comprobantes guardados (todos o los de un cliente / plan). */
B.hojaComprobantes = async (carpeta, nombre) => {
  let lista = B.d.Pruebas.filter(r => !carpeta || String(r.Archivo).startsWith(carpeta + '/'));
  if (carpeta === '' && nombre) lista = [];
  if (!carpeta && !nombre) {   // «todos»: también las fotos sueltas que ya no tienen registro (p. ej. pruebas de versiones viejas)
    const conocidas = new Set(B.d.Pruebas.map(r => r.Archivo));
    for (const k of await B.db.keys('pruebas')) if (!conocidas.has(String(k))) lista.push({ Archivo: String(k), Titular: 'Sin registro', FechaPago: '' });
  }
  B._galeria = () => B.hojaComprobantes(carpeta, nombre);
  const grupos = new Map();
  [...lista].sort((a, b) => String(b.FechaPago).localeCompare(String(a.FechaPago)) || b.Archivo.localeCompare(a.Archivo))
    .forEach(r => { const k = r.Titular || 'Sin titular'; (grupos.get(k) || grupos.set(k, []).get(k)).push(r); });
  const html = grupos.size ? [...grupos].map(([t, rs]) => `
      <h3>${e(t)}</h3>
      <div class="galeria">${rs.map(r => `<button class="miniatura" data-r="${e(r.Archivo)}" aria-label="${e(B.nombreArchivo(r.Archivo))}">
        <img alt="" data-src="${e(r.Archivo)}"><small>${e(B.nombreArchivo(r.Archivo))}</small></button>`).join('')}</div>`).join('')
    : vacio('🧾', 'Sin comprobantes', 'Cada pago que registres guarda aquí su foto, ordenada por titular y mes.');
  const h = B.sheet(nombre ? `Comprobantes · ${nombre}` : 'Comprobantes', html, { alta: true });
  h.el.dataset.galeria = '1';
  h.el.addEventListener('click', ev => { const b = ev.target.closest('.miniatura'); if (b) B.verImagen(b.dataset.r); });
  for (const img of h.$$('img[data-src]')) {
    B.urlPrueba(img.dataset.src).then(u => { if (u) img.src = u; else img.closest('.miniatura').classList.add('perdida'); });
  }
};

B.verImagen = async ruta => {
  const blob = await B.db.get('pruebas', ruta);
  if (!blob) { B.aviso('No encuentro esa imagen en este teléfono. Si importaste un respaldo antiguo, es posible que no la incluyera.'); return; }
  const url = await B.urlPrueba(ruta), nombre = B.nombreArchivo(ruta);
  const h = B.sheet(nombre, `<img class="visor-img" src="${url}" alt="${e(nombre)}">
    <div class="acciones fin">
      ${navigator.canShare ? '<button class="btn fantasma" id="v-share">📤 Compartir</button>' : ''}
      <button class="btn fantasma" id="v-down">⬇ Descargar</button>
      <button class="btn fantasma peligro-t" id="v-del">🗑 Eliminar</button>
      <button class="btn" data-cerrar>Cerrar</button></div>`, { alta: true });
  h.$('#v-down').onclick = () => B.descargar(blob, nombre);
  h.$('#v-del').onclick = async () => {
    if (!await B.eliminarPrueba(ruta)) return;
    h.cerrar(); B.render(); B.toast('Comprobante eliminado', nombre, 'Info');
    const g = B._hojas[B._hojas.length - 1];   // si venías de la galería, se actualiza
    if (g && g.el.dataset.galeria && B._galeria) { g.cerrar(); setTimeout(B._galeria, 280); }
  };
  const s = h.$('#v-share');
  if (s) s.onclick = async () => {
    try { await navigator.share({ files: [new File([blob], nombre, { type: blob.type || B.mimeDe(nombre) })], title: nombre }); }
    catch (err) { if (err.name !== 'AbortError') B.descargar(blob, nombre); }
  };
};

  },

async function exportar(compartir) {
  // la contraseña es obligatoria: el respaldo siempre sale cifrado (.spcontrol)
  const clave = await B.pedirClave({
    titulo: 'Proteger el respaldo', nueva: true,
    intro: 'El respaldo lleva tus clientes, pagos y comprobantes, así que siempre se guarda con contraseña.',
  });
  if (!clave) return;
  const quitar = B.toast('Preparando respaldo…', 'Incluye tus datos y las fotos, cifrados con tu contraseña.', 'Info');
  try {
    let { blob, nombre, n } = await B.crearRespaldo();
    blob = await B.cripto.cifrar(blob, clave);
    nombre = nombre.replace(/\.zip$/, '.spcontrol');
    quitar();
    const file = new File([blob], nombre, { type: 'application/octet-stream' });
    if (compartir && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Respaldo SP-Control' }); B.toast('Respaldo listo', `${n} imagen(es) de prueba incluidas · con contraseña.`, 'Exito'); return; }
      catch (err) { if (err.name === 'AbortError') return; }
    }
    B.descargar(blob, nombre);
    B.info(`Se guardaron tus datos y ${n} imagen(es) de prueba, protegidos con contraseña.\n\n${nombre}\n\nGuárdalo en un lugar seguro (nube o USB).\nNo olvides la contraseña: sin ella no se puede abrir.`, 'Respaldo guardado', 'Exito');
  } catch (err) { quitar(); B.error('No se pudo crear el respaldo: ' + (err.message || err)); }
}

async function importar(file) {
  const kb = file.size >= 1048576 ? (file.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(file.size / 1024)) + ' KB';
  const c = B.cargando('Archivo recibido', `${file.name || 'respaldo'} · ${kb}`);
  try {
    await B.esperar(350);                       // para que alcance a verse
    c.texto('Leyendo el respaldo…', 'Un momento, no cierres la app.');
    const r = await B.leerRespaldo(file), d = r.Datos;
    c.cerrar();
    const fecha = r.Fecha ? B.horaTexto(r.Fecha) : '';
    if (!await B.confirmar('Importar respaldo',
      `Este respaldo${fecha ? ' es del ' + fecha : ''} y trae:\n\n• ${(d.Clientes || []).length} cliente(s)\n• ${(d.Planes || []).length} plan(es)\n• ${(d.Movimientos || []).length} movimiento(s)\n• ${r.Archivos.length} imagen(es) de prueba\n\nSe reemplazarán los datos actuales (antes se guarda una copia de seguridad automática). ¿Continuar?`,
      { si: 'Importar', peligro: true })) return;
    const c2 = B.cargando('Importando…', 'Guardando tus datos e imágenes.');
    let n;
    try { n = await B.restaurar(r); } finally { c2.cerrar(); }
    B.render();
    B.info(`Se restauraron los datos y ${n} imagen(es).`, 'Respaldo importado', 'Exito');
  } catch (err) { c.cerrar(); if (err && err.cancelado) return; B.error('No se pudo importar el respaldo: ' + (err.message || err)); }
}

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.id === 'archivo-respaldo') {

    const v = t.value.trim();
    if (t.id === 'hex-logo' && !v) { B.aj.logoColor = ''; aplicarAj(); return; }
    if (!B.color.esValido(v)) { B.aviso('Escribe un color en formato #RRGGBB, por ejemplo #FF5733.'); t.value = t.id === 'hex-acento' ? B.aj.acento : B.aj.logoColor; return; }
    const hex = '#' + v.replace('#', '').toUpperCase();
    if (t.id === 'hex-acento') B.aj.acento = hex; else B.aj.logoColor = hex;
    aplicarAj(); return;
  }
  if (t.id === 'aj-hora') { const n = parseInt(t.value, 10); B.d.AvisoHora = n >= 0 && n <= 23 ? n : B.d.AvisoHora; t.value = B.d.AvisoHora; await B.guardar(); return; }
  if (t.id === 'aj-dias') { const n = parseInt(t.value, 10); B.d.DiasCerca = n >= 0 && n <= 30 ? n : B.d.DiasCerca; t.value = B.d.DiasCerca; await B.guardar(); B.renderTabs(); return; }
});

/* Pantalla de inicio: se queda lo justo para que se vea construirse el logo y luego se desvanece. */
B.quitarSplash = () => {
  const s = document.getElementById('splash');
  if (!s) return;
  const reducida = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const falta = Math.max(0, (reducida ? 400 : 3500) - performance.now());
  setTimeout(() => { s.classList.add('sale'); setTimeout(() => s.remove(), 650); }, falta);
};

/* ───────────── Arranque ───────────── */
(async function iniciar() {
  await B.cargar();
  B.aplicarTema();
  B.render();
  B.quitarSplash();
  if (B.sinAlmacen) B.aviso('Este navegador no deja guardar datos (¿modo privado?). Lo que hagas no se conservará al cerrar.');

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(async reg => {
      try {   // en Android con la app instalada, el sistema puede revisar los pagos de vez en cuando
        if ('periodicSync' in reg) await reg.periodicSync.register('revisar-pagos', { minInterval: 12 * 3600 * 1000 });
      } catch { }
    }).catch(() => { });
  }
  try {   // avisa una sola vez cuando la app pasa a una versión nueva
    const antes = localStorage.getItem('spcontrol-ver') || localStorage.getItem('bluumxsic-ver');
    if (antes && antes !== B.VERSION) setTimeout(() => B.toast('App actualizada', `Ahora usas la versión ${B.VERSION} (antes ${antes}).`, 'Exito'), 1500);
    localStorage.setItem('spcontrol-ver', B.VERSION); localStorage.removeItem('bluumxsic-ver');
  } catch { }
  window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); B.ui.instalar = ev; if (B.ui.pag === 'mas') B.render(); });
  window.addEventListener('appinstalled', () => { B.ui.instalar = null; B.toast('App instalada', 'Ya puedes abrirla desde tu pantalla de inicio.', 'Exito'); });
  try { navigator.storage?.persist?.(); } catch { }

  // tasa BCV: al abrir (si tiene más de una hora) y cada hora
  const vieja = !B.d.TasaActualizada || (Date.now() - new Date(B.d.TasaActualizada).getTime()) > 3600e3;
  if (B.d.AutoActualizar && (vieja || !(B.d.Tasa > 0))) B.actualizarTasa(true);
  setInterval(() => { if (B.d.AutoActualizar && !document.hidden) B.actualizarTasa(true); }, 3600e3);

  // avisos de pago y cambio de día
  setTimeout(() => B.revisarPagos(false), 1200);
  setInterval(() => B.revisarPagos(false), 10 * 60e3);
  let dia = B.aIso(B.hoy());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (B.aIso(B.hoy()) !== dia) { dia = B.aIso(B.hoy()); B.ui.movDia = B.hoy(); }
    if (!B._hojas.length) B.render();
    B.revisarPagos(false);
  });
})();

</script>
